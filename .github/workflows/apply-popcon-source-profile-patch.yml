name: Apply POPCON Source Profile Patch

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/profile-coordinate-refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Apply source-profile worker reconstruction patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Relation: explicit, non-comparing metadata for picklable worker rebuild recipes.
          replace_once(
              "src/fusdb/relation.py",
              '        function_name: Decorated Python function name.\n',
              '        function_name: Decorated Python function name.\n'
              '        rebuild_spec: Optional picklable recipe for reconstructing runtime-generated\n'
              '            relations in worker processes. Registry relations leave this unset.\n',
          )
          replace_once(
              "src/fusdb/relation.py",
              '    argument_names: tuple[str, ...] = ()\n    constraint_relations: tuple["Relation", ...] = field(default_factory=tuple, init=False)\n',
              '    argument_names: tuple[str, ...] = ()\n'
              '    rebuild_spec: Mapping[str, Any] | None = field(default=None, repr=False, compare=False)\n'
              '    constraint_relations: tuple["Relation", ...] = field(default_factory=tuple, init=False)\n',
          )
          replace_once(
              "src/fusdb/relation.py",
              '        self.argument_names = tuple(self.argument_names or self.input_names)\n        if len(self.argument_names) != len(self.input_names):\n',
              '        self.argument_names = tuple(self.argument_names or self.input_names)\n'
              '        self.rebuild_spec = None if self.rebuild_spec is None else dict(self.rebuild_spec)\n'
              '        if len(self.argument_names) != len(self.input_names):\n',
          )
          replace_once(
              "src/fusdb/relation.py",
              '        function_name=rel.function_name,\n        argument_names=rel.argument_names,\n    )\n',
              '        function_name=rel.function_name,\n'
              '        argument_names=rel.argument_names,\n'
              '        rebuild_spec=rel.rebuild_spec,\n'
              '    )\n',
          )

          # Source-profile adapters: attach all immutable source data required for reconstruction.
          replace_once(
              "src/fusdb/profile_sources.py",
              '    fixed = bool(variable.fixed)\n\n    def shape_on(mapping: Any, rho: Any, w_V: Any = None, v_norm: Any = None) -> np.ndarray:\n',
              '    fixed = bool(variable.fixed)\n'
              '    rebuild_spec = {\n'
              '        "kind": "source_profile",\n'
              '        "version": 1,\n'
              '        "variable": name,\n'
              '        "coordinate": coordinate,\n'
              '        "source_coordinate": source.copy(),\n'
              '        "source_values": source_values.copy(),\n'
              '        "fixed": fixed,\n'
              '        "average_name": average_name,\n'
              '    }\n\n'
              '    def shape_on(mapping: Any, rho: Any, w_V: Any = None, v_norm: Any = None) -> np.ndarray:\n',
          )
          p = Path("src/fusdb/profile_sources.py")
          text = p.read_text()
          old = '                source_kind="source_profile",\n                source_name=name,\n            )'
          if text.count(old) != 4:
              raise RuntimeError(f"profile_sources.py: expected four Relation constructors, found {text.count(old)}")
          text = text.replace(
              old,
              '                source_kind="source_profile",\n'
              '                source_name=name,\n'
              '                rebuild_spec=rebuild_spec,\n'
              '            )',
          )
          p.write_text(text)
          replace_once(
              "src/fusdb/profile_sources.py",
              '\n\ndef prepare_source_profiles(\n',
              '''\n\ndef source_profile_relation_from_spec(spec: Mapping[str, Any]) -> Relation:\n    """Rebuild a generated source-profile relation from a picklable worker recipe."""\n    if spec.get("kind") != "source_profile":\n        raise ValueError(f"Unsupported generated relation kind {spec.get('kind')!r}.")\n    if int(spec.get("version", 1)) != 1:\n        raise ValueError(f"Unsupported source-profile rebuild spec version {spec.get('version')!r}.")\n    source_values = np.asarray(spec["source_values"], dtype=float)\n    source_coordinate = np.asarray(spec["source_coordinate"], dtype=float)\n    variable = Variable(\n        str(spec["variable"]),\n        value=source_values,\n        fixed=bool(spec.get("fixed", False)),\n        coordinate=str(spec.get("coordinate") or "rho"),\n        coordinate_values=source_coordinate,\n    )\n    average_name = spec.get("average_name")\n    return source_profile_relation(\n        variable,\n        average_name=None if average_name is None else str(average_name),\n    )\n\n\ndef prepare_source_profiles(\n''',
          )

          # POPCON: serialize registry relations by name and generated relations by rebuild recipe.
          popcon_old = '''def _system_spec(system: Any) -> dict[str, Any]:\n    """Picklable recipe to rebuild an equivalent system in a worker process.\n\n    Live systems cannot cross a process boundary (relation functions and parsed\n    constraints do not pickle), so a worker receives the record-level state --\n    supplied canonical values, fixed flags, tolerances -- plus registry relation\n    *names* and the raw constraint spec, and rebuilds from the shared registry.\n    """\n    return {\n        "name": system.name,\n        "variables": [\n            (\n                name,\n                system.inputs.get(name),\n                name in system.fixed,\n                system.rel_tols.get(name),\n                system.abs_tols.get(name),\n            )\n            for name in sorted(system.rel_tols)\n            if name != "rho"\n        ],\n        "relations": [rel.name for rel in system.candidate_primary_relations],\n        "constraints": system.constraints_spec,\n    }\n\n\ndef _rebuild_system(spec: Mapping[str, Any]) -> Any:\n    from fusdb.registry import RELATIONS\n    from fusdb.relationsystem import RelationSystem\n    from fusdb.variable import Variable\n\n    variables = [\n        Variable(name, value=value, rel_tol=rel_tol, abs_tol=abs_tol, fixed=fixed)\n        for name, value, fixed, rel_tol, abs_tol in spec["variables"]\n    ]\n    relations = [RELATIONS.get(name) for name in spec["relations"]]\n    return RelationSystem(variables, relations, constraints=spec["constraints"], name=spec["name"])\n'''
          popcon_new = '''def _relation_rebuild_spec(rel: Any) -> dict[str, Any]:\n    """Return the picklable worker recipe for one candidate relation."""\n    if rel.rebuild_spec is not None:\n        return dict(rel.rebuild_spec)\n    return {"kind": "registry", "name": rel.name}\n\n\ndef _system_spec(system: Any) -> dict[str, Any]:\n    """Picklable recipe to rebuild an equivalent system in a worker process.\n\n    Registry relations are represented by name. Runtime-generated relations\n    provide an explicit ``rebuild_spec`` containing only picklable immutable\n    source data. The common profile-grid size is carried separately so a source\n    profile sampled on an arbitrary external grid cannot reset worker geometry.\n    """\n    return {\n        "name": system.name,\n        "profile_size": int(system.profile_size),\n        "variables": [\n            (\n                name,\n                system.inputs.get(name),\n                name in system.fixed,\n                system.rel_tols.get(name),\n                system.abs_tols.get(name),\n            )\n            for name in sorted(system.rel_tols)\n            if name != "rho"\n        ],\n        "relations": [_relation_rebuild_spec(rel) for rel in system.candidate_primary_relations],\n        "constraints": system.constraints_spec,\n    }\n\n\ndef _rebuild_system(spec: Mapping[str, Any]) -> Any:\n    from fusdb.profile_sources import source_profile_relation_from_spec\n    from fusdb.registry import RELATIONS, VARIABLES\n    from fusdb.relationsystem import RelationSystem\n    from fusdb.variable import Variable\n\n    profile_size = int(spec.get("profile_size", VARIABLES.profile_size_default))\n    variables = [\n        Variable(\n            name,\n            value=value,\n            rel_tol=rel_tol,\n            abs_tol=abs_tol,\n            fixed=fixed,\n            size=profile_size if VARIABLES.get(name).shape == 1 else None,\n        )\n        for name, value, fixed, rel_tol, abs_tol in spec["variables"]\n    ]\n    relations = []\n    for relation_spec in spec["relations"]:\n        # String support keeps older serialized recipes readable inside a\n        # long-lived parent process while the new format is rolled out.\n        if isinstance(relation_spec, str):\n            relations.append(RELATIONS.get(relation_spec))\n            continue\n        if not isinstance(relation_spec, Mapping):\n            raise TypeError(f"Invalid relation rebuild spec {relation_spec!r}.")\n        kind = relation_spec.get("kind")\n        if kind == "registry":\n            relations.append(RELATIONS.get(str(relation_spec["name"])))\n        elif kind == "source_profile":\n            relations.append(source_profile_relation_from_spec(relation_spec))\n        else:\n            raise ValueError(f"Unsupported relation rebuild kind {kind!r}.")\n    return RelationSystem(variables, relations, constraints=spec["constraints"], name=spec["name"])\n'''
          replace_once("src/fusdb/modes/popcon.py", popcon_old, popcon_new)

          Path("tests/test_popcon_source_profiles.py").write_text('''"""Parallel POPCON reconstruction of runtime-generated source profiles."""\n\nfrom __future__ import annotations\n\nimport pickle\n\nimport numpy as np\n\nfrom fusdb.modes import popcon as popcon_mode\nfrom fusdb.profile_system import build_relation_system\nfrom fusdb.registry import RELATIONS\nfrom fusdb.variable import Variable\n\n\ndef _source_system(profile_size: int = 31):\n    source_coordinate = np.linspace(0.0, 1.0, 101)\n    source_values = 3.0e19 * (1.0 - 0.45 * source_coordinate**2)\n    return build_relation_system(\n        [\n            Variable(\n                "n_e",\n                value=source_values,\n                coordinate="rho",\n                coordinate_values=source_coordinate,\n            ),\n            Variable("density_peaking", value=1.5),\n        ],\n        (RELATIONS.get("Electron density rho-average"),),\n        profile_size=profile_size,\n    )\n\n\ndef test_source_profile_worker_recipe_is_picklable_and_preserves_grid():\n    original = _source_system(profile_size=31)\n    original.compile()\n    spec = popcon_mode._system_spec(original)\n\n    pickle.dumps(spec)\n    generated = [item for item in spec["relations"] if item.get("kind") == "source_profile"]\n    assert len(generated) == 1\n    assert generated[0]["variable"] == "n_e"\n    assert np.asarray(generated[0]["source_values"]).shape == (101,)\n\n    rebuilt = popcon_mode._rebuild_system(spec)\n    rebuilt.compile()\n    assert rebuilt.profile_size == 31\n\n    original_values = original.complete(dict(original.input_values()))\n    rebuilt_values = rebuilt.complete(dict(rebuilt.input_values()))\n    np.testing.assert_allclose(rebuilt_values["n_e"], original_values["n_e"], rtol=0.0, atol=0.0)\n    assert np.asarray(rebuilt_values["n_e"]).shape == (31,)\n\n\ndef test_parallel_popcon_with_source_profile_matches_serial():\n    x = {"variable": "n_e_avg", "values": [2.0e19, 3.0e19]}\n    y = {"variable": "density_peaking", "values": [1.2, 1.8]}\n    outputs = ("n_e_rho_avg",)\n\n    serial = popcon_mode.run(_source_system(), x=x, y=y, outputs=outputs)\n    parallel = popcon_mode.run(\n        _source_system(),\n        x=x,\n        y=y,\n        outputs=outputs,\n        workers=2,\n        chunk_size=2,\n    )\n\n    assert serial["success"] and parallel["success"]\n    serial_payload = serial["popcon"]\n    parallel_payload = parallel["popcon"]\n    assert np.array_equal(parallel_payload["success"], serial_payload["success"])\n    assert parallel_payload["success"].all()\n    np.testing.assert_allclose(\n        parallel_payload["fields"]["n_e_rho_avg"],\n        serial_payload["fields"]["n_e_rho_avg"],\n        rtol=1.0e-12,\n        atol=0.0,\n    )\n''')
          PY

      - name: Run focused POPCON tests
        run: python -m pytest -q tests/test_popcon_source_profiles.py tests/test_popcon_mode.py

      - name: Commit tested patch
        run: |
          rm .github/workflows/apply-popcon-source-profile-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fusdb/relation.py src/fusdb/profile_sources.py src/fusdb/modes/popcon.py tests/test_popcon_source_profiles.py .github/workflows/apply-popcon-source-profile-patch.yml
          git commit -m "fix: rebuild source profiles in parallel popcon"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
