name: Profile Refactor Self Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  profile-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Publish STELLARIS regression probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          probe=$(python - <<'PY'
          from fusdb import Reactor
          result = Reactor.from_yaml("reactors/STELLARIS/reactor.yaml").run("reconcile")
          v = result["values"]
          print(f"tp={v['tau_p']:.5g},te={v['tau_E']:.5g},Te={v['T_e_avg']:.5g},ne={v['n_e_avg']:.5g},bad={len(result.get('inputs_beyond_tolerance') or ())}")
          PY
          )
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
            -d "{\"state\":\"success\",\"context\":\"fusdb/diag/stellaris/$probe\",\"description\":\"STELLARIS numeric probe\"}" >/dev/null
      - name: Run targeted tests and publish per-file statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          overall=0
          for testfile in \
            tests/test_profile_coordinates.py \
            tests/test_variable_source_coordinates.py \
            tests/test_profile_source_system.py \
            tests/test_profile_system_builder.py \
            tests/test_reactor_profile_sources.py \
            tests/test_variable_default_relation.py \
            tests/test_relation_default_overrides.py \
            tests/test_explicit_profile_mappings.py \
            tests/test_coordinate_nonpackability.py \
            tests/test_coordinate_registry_identity.py \
            tests/test_coordinate_domain_rows.py \
            tests/test_reduced_device_coordinates.py \
            tests/test_sauter_profile_volume_mapping.py \
            tests/test_non_tokamak_profile_links.py \
            tests/test_giga_profile_sources.py \
            tests/test_stellaris_regression.py \
            tests/test_bootstrap_coordinate_mapping.py \
            tests/test_pedestal_coordinate_mapping.py \
            tests/test_source_profile_measure_dependency.py \
            tests/test_fixed_source_measure_independence.py \
            tests/test_process_core_radiation_coordinates.py \
            tests/test_profile_average_consistency.py \
            tests/test_imported_confinement_fast_ion_relations.py \
            tests/test_relation_contract.py \
            tests/test_relation_registry_build.py \
            tests/test_reconcile_sparsity.py \
            tests/test_popcon_mode.py \
            tests/test_phase1_contracts.py \
            tests/cfspopcon_SPARC/test_sparc_prd.py
          do
            python -m pytest "$testfile"
            rc=$?
            short=$(basename "$testfile" .py)
            if [ "$rc" -eq 0 ]; then state=success; else state=failure; overall=1; fi
            curl -sS -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
              -d "{\"state\":\"$state\",\"context\":\"fusdb/self-test/$short\",\"description\":\"$short: $state\"}" >/dev/null
          done
          if [ "$overall" -eq 0 ]; then state=success; description="all profile refactor targeted tests passed"; else state=failure; description="one or more targeted tests failed"; fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"fusdb/profile-refactor-self-test\",\"description\":\"$description\"}" >/dev/null
          exit "$overall"

  full-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run full pytest suite
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python -m pytest
          rc=$?
          if [ "$rc" -eq 0 ]; then state=success; description="full pytest suite passed on Python 3.12"; else state=failure; description="full pytest suite failed on Python 3.12"; fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"fusdb/full-pytest-3.12\",\"description\":\"$description\"}" >/dev/null
          exit "$rc"

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install shared dependencies
        run: python -m pip install -e ".[test]"
      - name: Check out main baseline
        run: |
          git fetch origin main
          git worktree add /tmp/fusdb-main origin/main
      - name: Benchmark reconcile and POPCON against main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import statistics
          import subprocess
          import sys
          from pathlib import Path

          head = Path(os.environ["GITHUB_WORKSPACE"])
          main = Path("/tmp/fusdb-main")
          roots = {"main": main, "head": head}
          marker = "FUSDB_BENCH_SECONDS="

          scripts = {
              "reconcile": r'''
from pathlib import Path
import time
from fusdb import Reactor
r = Reactor.from_yaml(Path("reactors/ARC_V0/reactor.yaml"))
t0 = time.perf_counter()
result = r.reconcile()
elapsed = time.perf_counter() - t0
assert result["success"], result.get("errors")
print("FUSDB_BENCH_SECONDS=" + repr(elapsed))
''',
              "popcon": r'''
from pathlib import Path
import time
from fusdb import Reactor
r = Reactor.from_yaml(Path("tests/cfspopcon_SPARC/reactor.yaml"))
t0 = time.perf_counter()
result = r.popcon(
    x={"variable": "average_electron_density", "values": [2.5e20, 3.0e20]},
    y={"variable": "average_electron_temp", "values": [9.0, 12.0]},
    outputs=("P_fus", "P_aux"),
)
elapsed = time.perf_counter() - t0
assert result["success"], result.get("errors")
assert result["popcon"]["success"].all(), result["popcon"]["failures"]
print("FUSDB_BENCH_SECONDS=" + repr(elapsed))
''',
          }

          order = ("main", "head", "head", "main", "main", "head")
          results = {}
          for workload, code in scripts.items():
              samples = {"main": [], "head": []}
              for label in order:
                  root = roots[label]
                  env = dict(os.environ)
                  env["PYTHONPATH"] = str(root / "src")
                  completed = subprocess.run(
                      [sys.executable, "-c", code],
                      cwd=root,
                      env=env,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  if completed.returncode != 0:
                      print(completed.stdout)
                      raise SystemExit(f"{label} {workload} benchmark failed")
                  timings = [
                      float(line[len(marker):])
                      for line in completed.stdout.splitlines()
                      if line.startswith(marker)
                  ]
                  if len(timings) != 1:
                      print(completed.stdout)
                      raise SystemExit(f"{label} {workload} emitted {len(timings)} timing markers")
                  samples[label].append(timings[0])
                  print(f"{workload} {label}: {timings[0]:.6f}s")
              baseline = statistics.median(samples["main"])
              candidate = statistics.median(samples["head"])
              results[workload] = {
                  "main": baseline,
                  "head": candidate,
                  "ratio": candidate / baseline,
              }

          print(json.dumps(results, indent=2, sort_keys=True))
          failed = False
          for workload, values in results.items():
              ratio = values["ratio"]
              state = "success" if ratio <= 1.10 else "failure"
              failed |= state == "failure"
              description = (
                  f"main {values['main']:.2f}s, head {values['head']:.2f}s, "
                  f"ratio {ratio:.3f} (limit 1.10)"
              )
              payload = json.dumps({
                  "state": state,
                  "context": f"fusdb/perf/{workload}",
                  "description": description,
              })
              completed = subprocess.run(
                  [
                      "curl", "-sS", "-L", "-X", "POST",
                      "-H", "Accept: application/vnd.github+json",
                      "-H", f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                      "-H", "X-GitHub-Api-Version: 2022-11-28",
                      f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['HEAD_SHA']}",
                      "-d", payload,
                  ],
                  check=False,
              )
              if completed.returncode != 0:
                  raise SystemExit(f"failed to publish {workload} performance status")
          if failed:
              raise SystemExit("Performance regression exceeded 10% threshold")
          PY
