name: Profile Refactor Performance Probe

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  statuses: write

jobs:
  benchmark:
    if: github.head_ref == 'agent/profile-coordinate-refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install shared dependencies
        run: python -m pip install -e ".[test]"

      - name: Check out main baseline
        run: |
          git fetch origin main
          git worktree add /tmp/fusdb-main origin/main

      - name: Benchmark unchanged reconcile and POPCON tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import statistics
          import subprocess
          import sys
          import time
          import urllib.request
          from pathlib import Path

          head = Path(os.environ["GITHUB_WORKSPACE"])
          main = Path("/tmp/fusdb-main")
          workloads = {
              "popcon": "tests/test_popcon_mode.py",
              "reconcile": "tests/test_reconcile_sparsity.py",
          }
          # These files are unchanged in PR #6, so both revisions execute the
          # same tests. Alternating revisions limits runner drift; medians reject
          # one noisy sample without hiding a repeatable regression.
          order = ("main", "head", "head", "main", "main", "head")
          roots = {"main": main, "head": head}
          results: dict[str, dict[str, float]] = {}

          for workload, test_file in workloads.items():
              samples = {"main": [], "head": []}
              for label in order:
                  root = roots[label]
                  env = dict(os.environ)
                  env["PYTHONPATH"] = str(root / "src")
                  start = time.perf_counter()
                  completed = subprocess.run(
                      [
                          sys.executable,
                          "-m",
                          "pytest",
                          "-q",
                          "-p",
                          "no:cacheprovider",
                          test_file,
                      ],
                      cwd=root,
                      env=env,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  elapsed = time.perf_counter() - start
                  if completed.returncode != 0:
                      print(completed.stdout)
                      raise SystemExit(
                          f"{label} {workload} benchmark tests failed with code {completed.returncode}"
                      )
                  samples[label].append(elapsed)
                  print(f"{workload} {label}: {elapsed:.3f}s")
              baseline = statistics.median(samples["main"])
              candidate = statistics.median(samples["head"])
              ratio = candidate / baseline
              results[workload] = {
                  "main": baseline,
                  "head": candidate,
                  "ratio": ratio,
              }

          print(json.dumps(results, indent=2, sort_keys=True))

          api = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/statuses/{os.environ['GITHUB_SHA']}"
          )
          token = os.environ["GH_TOKEN"]
          failed = False
          for workload, values in results.items():
              ratio = values["ratio"]
              state = "success" if ratio <= 1.10 else "failure"
              failed |= state == "failure"
              description = (
                  f"main {values['main']:.2f}s, head {values['head']:.2f}s, "
                  f"ratio {ratio:.3f} (limit 1.10)"
              )
              payload = json.dumps(
                  {
                      "state": state,
                      "context": f"fusdb/perf/{workload}",
                      "description": description,
                  }
              ).encode()
              request = urllib.request.Request(
                  api,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  response.read()

          if failed:
              raise SystemExit("Performance regression exceeded 10% threshold")
          PY
