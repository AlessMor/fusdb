name: Refactor step 1 - constraints

on:
  push:
    branches:
      - refactor/concise-core-20260817
    paths:
      - .github/refactor_step1_constraints.py
      - .github/workflows/refactor-step1-constraints.yml

permissions:
  contents: write

jobs:
  refactor-and-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply refactor
        run: python .github/refactor_step1_constraints.py
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Constraint-focused tests
        run: python -m pytest -q tests/test_relation_registry_build.py tests/test_phase1_contracts.py
      - name: Reconcile all
        run: python -m pytest -q -k reconcile
      - name: SPARC PRD
        run: python -m pytest -q tests/cfspopcon_SPARC/test_sparc_prd.py
      - name: PROCESS
        run: python -m pytest -q tests/PROCESS_large_tokamak
      - name: Full suite
        run: python -m pytest -q
      - name: Diff check
        run: git diff --check
      - name: Commit certified step
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fusdb/relation.py src/fusdb/variable.py src/fusdb/registry/variable_registry.py
          git diff --cached --check
          git commit -m 'refactor: centralize constraint relation construction'
          git push
