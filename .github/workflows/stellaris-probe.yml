name: STELLARIS Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Publish tolerance outliers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          probe=$(python - <<'PY'
          from fusdb import Reactor
          result = Reactor.from_yaml("reactors/STELLARIS/reactor.yaml").run("reconcile")
          items = result.get("inputs_beyond_tolerance") or []
          print("|".join(f"{item['name']}={item['deviation_tol']:.4g}" for item in items))
          PY
          )
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
            -d "{\"state\":\"success\",\"context\":\"fusdb/diag/stellaris-outliers/$probe\",\"description\":\"STELLARIS tolerance outliers\"}" >/dev/null
