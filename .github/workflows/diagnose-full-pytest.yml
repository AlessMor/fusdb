name: Diagnose Full Pytest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Run pytest and publish failed node ids
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee /tmp/pytest.txt
          rc=${PIPESTATUS[0]}
          python - <<'PY'
          import json, os, re, urllib.request
          text = open('/tmp/pytest.txt', encoding='utf-8').read().splitlines()
          failed = []
          for line in text:
              if line.startswith('FAILED '):
                  node = line[7:].split(' - ', 1)[0].strip()
                  if node and node not in failed:
                      failed.append(node)
          for i, node in enumerate(failed[:20], 1):
              desc = node[:140]
              context = f"fusdb/diag/full-{i}-{node.split('::')[-1]}"[:100]
              payload = json.dumps({'state':'failure','context':context,'description':desc}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept':'application/vnd.github+json',
                      'Content-Type':'application/json',
                      'X-GitHub-Api-Version':'2022-11-28',
                  },
              )
              urllib.request.urlopen(req).read()
          PY
          exit $rc
