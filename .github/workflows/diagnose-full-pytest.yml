name: Diagnose Full Pytest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run pytest and publish failed node ids
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          rc=${PIPESTATUS[0]}
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          text = Path("pytest-output.txt").read_text(errors="replace")
          failed = []
          for line in text.splitlines():
              if line.startswith("FAILED "):
                  node = line[len("FAILED "):].split(" - ", 1)[0].strip()
                  if node and node not in failed:
                      failed.append(node)
          repo = os.environ["REPO"]
          sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          for index, node in enumerate(failed[:20], 1):
              compact = re.sub(r"[^A-Za-z0-9_.:/-]+", "_", node)
              context = f"fusdb/pytest-fail/{index}:{compact}"[:100]
              payload = json.dumps({
                  "state": "failure",
                  "context": context,
                  "description": node[:140],
              }).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/statuses/{sha}",
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  response.read()
          if not failed and "failed" in text.lower():
              payload = json.dumps({
                  "state": "failure",
                  "context": "fusdb/pytest-fail/unparsed",
                  "description": "pytest failed but node ids could not be parsed",
              }).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/statuses/{sha}",
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  response.read()
          PY
          exit "$rc"
