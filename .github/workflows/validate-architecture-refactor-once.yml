name: Validate architecture refactor once

on:
  push:
    branches:
      - refactor/architecture-simplification-20260817

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/architecture-simplification-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - run: python -m pytest
      - name: Record passing validation
        run: |
          rm -f .github/workflows/validate-architecture-refactor-once.yml
          printf '%s\n' "validated $(git rev-parse HEAD) on Python 3.12" > .architecture-refactor-ci-pass
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: record architecture refactor validation'
          git push origin HEAD:refactor/architecture-simplification-20260817
