name: Profile Runtime Diagnose

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Diagnose runtime completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          overall=0
          tests=(
            test_runtime_provider_executes_without_error
            test_runtime_mapping_is_not_overwritten
            test_runtime_profile_is_recomputed
            test_runtime_profile_preserves_average
            test_runtime_fixed_provider_executes_without_error
            test_runtime_fixed_profile_is_recomputed
            test_runtime_fixed_profile_matches_absolute_source
            test_runtime_out_of_coverage_records_completion_error
            test_runtime_out_of_coverage_error_is_source_relation
          )
          for testname in "${tests[@]}"; do
            python -m pytest "tests/test_profile_source_runtime_diagnostics.py::$testname"
            rc=$?
            if [ "$rc" -eq 0 ]; then state=success; else state=failure; overall=1; fi
            curl -sS -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
              -d "{\"state\":\"$state\",\"context\":\"fusdb/runtime/$testname\",\"description\":\"$testname: $state\"}" >/dev/null
          done
          exit "$overall"
