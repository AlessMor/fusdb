name: Apply module subdivision refactor

on:
  push:
    branches:
      - refactor/architecture-simplification-20260817

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/architecture-simplification-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply and validate refactor
        shell: bash
        run: |
          set +e
          cp .github/apply_module_subdivision_fixups.py /tmp/apply_module_subdivision_fixups.py
          python .github/apply_module_subdivision.py > /tmp/module-subdivision.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python /tmp/apply_module_subdivision_fixups.py >> /tmp/module-subdivision.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python -m pip install --upgrade pip >> /tmp/module-subdivision.log 2>&1
            python -m pip install -e '.[test]' >> /tmp/module-subdivision.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python -m pytest >> /tmp/module-subdivision.log 2>&1
            code=$?
          fi
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$code" -eq 0 ]; then
            git add -A
            git rm -f .github/apply_module_subdivision.py .github/apply_module_subdivision_fixups.py .github/workflows/apply-module-subdivision.yml .github/module-subdivision-trigger.txt
            git commit -m 'refactor: reorganize support modules and inline trivial helpers'
          else
            git reset --hard HEAD
            git clean -fd
            {
              echo "MODULE_SUBDIVISION_EXIT_CODE=$code"
              echo
              echo "--- LOG TAIL ---"
              tail -n 240 /tmp/module-subdivision.log
            } > .module-subdivision-validation.txt
            git add .module-subdivision-validation.txt
            git commit -m 'test: record module subdivision failure'
          fi
          git push origin HEAD:refactor/architecture-simplification-20260817
