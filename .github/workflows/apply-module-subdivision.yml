name: Apply module subdivision refactor

on:
  push:
    branches:
      - refactor/architecture-simplification-20260817

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/architecture-simplification-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply and validate refactor
        shell: bash
        run: |
          set +e
          rm -f .module-subdivision-validation.txt
          cp .github/apply_module_subdivision_fixups.py /tmp/apply_module_subdivision_fixups.py
          python - <<'PY'
          from pathlib import Path

          reactor = Path('src/fusdb/reactor.py')
          source = reactor.read_text(encoding='utf-8')
          source = source.replace(
              'self.relation_include = _with_sustainment_guards(base_include, _confinement_regime(self.tags))',
              'self.relation_include = _unique_extend(base_include, _regime_guard_names(_confinement_regime(self.tags)))',
          )
          reactor.write_text(source, encoding='utf-8')

          path = Path('.github/apply_module_subdivision.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'text = read(reactor)\nif text.count("_with_sustainment_guards") > 1:\n    raise RuntimeError("_with_sustainment_guards unexpectedly has live callers")\nwrite(reactor, text)\nremove_top_level(reactor, "_with_sustainment_guards")',
              'remove_top_level(reactor, "_with_sustainment_guards")',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python .github/apply_module_subdivision.py > /tmp/module-subdivision.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python /tmp/apply_module_subdivision_fixups.py >> /tmp/module-subdivision.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python -m pip install --upgrade pip >> /tmp/module-subdivision.log 2>&1
            python -m pip install -e '.[test]' >> /tmp/module-subdivision.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python -m pytest --collect-only -q >> /tmp/module-subdivision.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python -m pytest -q \
              tests/test_public_api.py \
              tests/test_plotting_data.py \
              tests/test_dataset_registry.py \
              tests/test_reactor_table.py \
              tests/test_profile_source_system.py \
              tests/test_popcon_source_profiles.py \
              tests/test_profile_coordinates.py \
              tests/test_relation_registry_build.py \
              tests/test_result_io.py >> /tmp/module-subdivision.log 2>&1
            code=$?
          fi
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$code" -eq 0 ]; then
            git add -A
            git rm -f --ignore-unmatch .github/apply_module_subdivision.py .github/apply_module_subdivision_fixups.py .github/workflows/apply-module-subdivision.yml .github/module-subdivision-trigger.txt .module-subdivision-validation.txt
            git commit -m 'refactor: reorganize support modules and inline trivial helpers'
          else
            git reset --hard HEAD
            git clean -fd
            {
              echo "MODULE_SUBDIVISION_EXIT_CODE=$code"
              echo
              echo "--- LOG TAIL ---"
              tail -n 240 /tmp/module-subdivision.log
            } > .module-subdivision-validation.txt
            git add .module-subdivision-validation.txt
            git commit -m 'test: record module subdivision failure'
          fi
          git push origin HEAD:refactor/architecture-simplification-20260817
