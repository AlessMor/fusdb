name: Apply module subdivision refactor

on:
  push:
    branches:
      - refactor/architecture-simplification-20260817

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/architecture-simplification-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply refactor
        run: |
          python .github/apply_module_subdivision.py
          python .github/apply_module_subdivision_fixups.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run full test suite
        run: python -m pytest
      - name: Commit validated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/apply_module_subdivision.py .github/apply_module_subdivision_fixups.py .github/workflows/apply-module-subdivision.yml .github/module-subdivision-trigger.txt
          git commit -m 'refactor: reorganize support modules and inline trivial helpers'
          git push origin HEAD:refactor/architecture-simplification-20260817
