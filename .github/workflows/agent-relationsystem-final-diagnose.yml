name: RelationSystem final diagnose

on:
  push:
    branches:
      - agent/relationsystem-model-refactor-work
    paths:
      - .github/workflows/agent-relationsystem-final-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply complete refactor
        run: |
          python .github/agent_relationsystem_model_refactor.py
          python .github/agent_relationsystem_model_fix.py
          python .github/agent_relationsystem_model_fix2.py
          python .github/agent_relationsystem_graph_verdict_refactor.py
          python .github/agent_relationsystem_compile_split.py
          python .github/agent_relationsystem_structure_cache.py
          python .github/agent_relationsystem_popcon_model_reuse.py
      - run: python -m pip install -e '.[test]' >/dev/null 2>&1
      - name: Capture first full-suite failure
        shell: bash
        run: |
          python -m pytest -x -vv > .github/agent_relationsystem_final_failure.txt 2>&1 || true
      - name: Record diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/agent_relationsystem_final_failure.txt
          git commit -m 'chore: record final RelationSystem refactor failure'
          git push
