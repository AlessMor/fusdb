name: RelationSystem corrected final validation

on:
  push:
    branches:
      - agent/relationsystem-model-refactor-work
    paths:
      - .github/workflows/agent-relationsystem-final-corrected.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply corrected refactor
        run: |
          python .github/agent_relationsystem_model_refactor.py
          python .github/agent_relationsystem_model_fix.py
          python .github/agent_relationsystem_model_fix2.py
          python .github/agent_relationsystem_graph_verdict_refactor.py
          python .github/agent_relationsystem_compile_split.py
          python .github/agent_relationsystem_structure_cache.py
          python .github/agent_relationsystem_popcon_model_reuse.py
          python .github/agent_relationsystem_popcon_semantics_fix.py
      - run: python -m pip install -e '.[test]' >/dev/null 2>&1
      - name: Architecture contracts
        run: |
          python -m pytest \
            tests/test_relation_system_compile_plan.py \
            tests/test_relation_graph_centralization.py \
            tests/test_public_api.py \
            tests/test_coordinate_domain_rows.py \
            tests/test_popcon_source_profiles.py \
            tests/test_popcon_source_profile_mappings.py \
            tests/test_popcon_mode.py \
            'tests/cfspopcon_SPARC/test_sparc_prd.py::test_match_field_within_tolerance[separatrix_electron_temp]'
      - name: Full suite
        run: python -m pytest
      - name: Diff check
        run: git diff --check
      - name: Commit validated source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs
          git diff --cached --check
          git commit -m 'refactor: make RelationSystem the prepared model'
          git push
