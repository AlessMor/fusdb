name: Temporary architecture cleanup evaluation 3

on:
  push:
    branches:
      - tmp/architecture-cleanup-eval3-20260818

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Apply candidate in working tree
        shell: bash
        run: |
          mv src/fusdb/io/tables.py src/fusdb/plotting/tables.py
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          root = Path('src/fusdb')
          tables = root / 'plotting/tables.py'

          def remove_top_level_function(text: str, name: str) -> str:
              tree = ast.parse(text)
              node = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name)
              lines = text.splitlines(keepends=True)
              start, end = node.lineno - 1, node.end_lineno or node.lineno
              while end < len(lines) and not lines[end].strip():
                  end += 1
              return ''.join(lines[:start] + lines[end:])

          text = tables.read_text(encoding='utf-8')
          text = remove_top_level_function(text, '_sort_table_variable_names')
          text = remove_top_level_function(text, '_displayed_variable_names')
          old = '    ordered_names = _displayed_variable_names(columns, variable_names)\n'
          new = '''    if variable_names is not None:\n        ordered_names = tuple(variable_names)\n    else:\n        names: set[str] = set()\n        for column in columns:\n            names.update(column.active_variable_names)\n            names.update(column.inputs)\n        registry_order = {spec.name: index for index, spec in enumerate(VARIABLES)}\n        ordered_names = tuple(\n            sorted(names, key=lambda name: (registry_order.get(name, len(registry_order)), name))\n        )\n'''
          tables.write_text(text.replace(old, new, 1), encoding='utf-8')

          (root / 'io/__init__.py').write_text(
              '''\"\"\"FusDB input/output internals and result persistence.\"\"\"\n\nfrom .results import load_result, save_result\n\n__all__ = [\"load_result\", \"save_result\"]\n''',
              encoding='utf-8',
          )
          (root / 'plotting/__init__.py').write_text(
              '''\"\"\"Backend-neutral plotting and display data with lazy renderers.\n\nTable preparation is dependency-light. Matplotlib and Bokeh backends are\nloaded only when their exported names are accessed.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom importlib import import_module\nfrom typing import Any\n\n_EXPORTS = {\n    \"Curve\": \"data\",\n    \"CurveSet\": \"data\",\n    \"FieldMap\": \"data\",\n    \"TableCell\": \"tables\",\n    \"TableData\": \"tables\",\n    \"SolvedColumn\": \"tables\",\n    \"render_table\": \"tables\",\n    \"variable_table_data\": \"tables\",\n    \"bokeh_curve_set\": \"bokeh\",\n    \"plot_curve_set\": \"matplotlib\",\n    \"plot_field_map\": \"matplotlib\",\n    \"popcon_field_map\": \"popcon\",\n    \"profile_curves\": \"profiles\",\n    \"reactivity_curves\": \"reactivity\",\n    \"bokeh_relation_graph\": \"relation_graph\",\n    \"build_relation_graph\": \"relation_graph\",\n    \"plot_relation_graph\": \"relation_graph\",\n}\n\n__all__ = sorted(_EXPORTS)\n\n\ndef __getattr__(name: str) -> Any:\n    module_name = _EXPORTS.get(name)\n    if module_name is None:\n        raise AttributeError(name)\n    return getattr(import_module(f\".{module_name}\", __name__), name)\n\n\ndef __dir__() -> list[str]:\n    return sorted({*globals(), *_EXPORTS})\n''',
              encoding='utf-8',
          )

          # Update the owning import everywhere, including tests/docs that test
          # behavior rather than preserving an obsolete module path.
          for base in (Path('src'), Path('tests'), Path('docs')):
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.py', '.md', '.rst'}:
                      continue
                  try:
                      current = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  updated = current.replace('fusdb.io.tables', 'fusdb.plotting.tables')
                  updated = updated.replace('.io.tables import', '.plotting.tables import')
                  if updated != current:
                      path.write_text(updated, encoding='utf-8')

          tag_path = root / 'registry/tag_registry.py'
          text = tag_path.read_text(encoding='utf-8')
          old = '''        rel_tags = set(normalize_tags(relation_tags))\n        active = set(self.expand(reactor_tags))\n        if not rel_tags or not active:\n            return True\n\n        required_by_group: dict[str, set[str]] = {}\n        for tag in rel_tags:\n            group = self.tag_to_group.get(tag)\n            if group is None:\n                continue\n            required_by_group.setdefault(group, set()).add(tag)\n\n        return all(bool(group_tags & active) for group_tags in required_by_group.values())\n'''
          new = '''        rel_tags = set(normalize_tags(relation_tags))\n        active = set(self.expand(reactor_tags))\n        if not rel_tags:\n            return True\n\n        required_by_group: dict[str, set[str]] = {}\n        for tag in rel_tags:\n            group = self.tag_to_group.get(tag)\n            if group is None:\n                continue\n            required_by_group.setdefault(group, set()).add(tag)\n\n        if not active:\n            return not required_by_group\n        return all(bool(group_tags & active) for group_tags in required_by_group.values())\n'''
          tag_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/agent_relationsystem_*
          rm -f .github/workflows/agent-relationsystem-*
          cat > /tmp/test_tag_semantics.py <<'PY'
          from fusdb.registry.tag_registry import TagRegistry

          def test_empty_reactor_tags_mean_unscoped_only():
              registry = TagRegistry({'device': ['tokamak'], 'descriptive': ['profile']})
              assert registry.relation_matches((), ())
              assert registry.relation_matches(('profile',), ())
              assert not registry.relation_matches(('tokamak',), ())
              assert not registry.relation_matches(('tokamak', 'profile'), ())
              assert registry.relation_matches(('tokamak',), ('tokamak',))
          PY
      - name: Targeted tests
        id: targeted
        shell: bash
        run: |
          set +e
          python -m pytest -q /tmp/test_tag_semantics.py tests/test_plotting_data.py tests/test_result_io.py tests/test_phase1_contracts.py tests/test_relation_registry_build.py 2>&1 | tee /tmp/targeted3.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Full suite
        id: full
        shell: bash
        run: |
          set +e
          python -m pytest 2>&1 | tee /tmp/full3.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record result and keep candidate only if green
        shell: bash
        run: |
          targeted='${{ steps.targeted.outputs.exit_code }}'
          full='${{ steps.full.outputs.exit_code }}'
          {
            echo 'ARCHITECTURE CLEANUP EXPERIMENT 3'
            echo "TARGETED_EXIT_CODE=$targeted"
            echo "FULL_EXIT_CODE=$full"
            echo
            echo '--- TARGETED TAIL ---'
            tail -n 60 /tmp/targeted3.txt
            echo
            echo '--- FULL TAIL ---'
            tail -n 100 /tmp/full3.txt
          } > /tmp/report3.txt
          if [ "$targeted" != '0' ] || [ "$full" != '0' ]; then
            git reset --hard HEAD
          fi
          rm -f .github/workflows/tmp-architecture-cleanup-eval3.yml
          cp /tmp/report3.txt .tmp-cleanup-validation3.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'tmp: record architecture cleanup evaluation 3'
          git push origin HEAD:tmp/architecture-cleanup-eval3-20260818
