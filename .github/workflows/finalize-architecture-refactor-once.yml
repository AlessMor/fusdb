name: Finalize architecture refactor once

on:
  push:
    branches:
      - refactor/architecture-simplification-20260817

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/architecture-simplification-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply final low-risk pass
        run: python tools/finalize_architecture_refactor.py
      - name: Remove transient branch tooling
        run: |
          rm -f tools/finalize_architecture_refactor.py
          rm -f .github/workflows/finalize-architecture-refactor-once.yml
          rm -f .github/workflows/diagnose-architecture-refactor-once.yml
          rm -f .github/workflows/validate-architecture-refactor-once.yml
          rm -f .architecture-refactor-ci-pass .architecture-refactor-test.log
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run full suite and record implementation LOC
        shell: bash
        run: |
          set +e
          python -m pytest > /tmp/pytest.log 2>&1
          code=$?
          set -e
          python - <<'PY' > .architecture-refactor-validation.txt
          import ast
          import subprocess
          import tempfile
          from pathlib import Path

          BASE = '5c972650777afe97d344c7097c8a5215df599af5'

          def implementation_loc(root: Path) -> int:
              total = 0
              for path in root.rglob('*.py'):
                  text = path.read_text(encoding='utf-8')
                  lines = text.splitlines()
                  try:
                      tree = ast.parse(text)
                  except SyntaxError:
                      continue
                  doc_lines = set()
                  for node in ast.walk(tree):
                      body = getattr(node, 'body', None)
                      if body and isinstance(body, list):
                          first = body[0] if body else None
                          if isinstance(first, ast.Expr) and isinstance(first.value, ast.Constant) and isinstance(first.value.value, str):
                              doc_lines.update(range(first.lineno, (first.end_lineno or first.lineno) + 1))
                  for lineno, line in enumerate(lines, 1):
                      stripped = line.strip()
                      if not stripped or lineno in doc_lines or stripped.startswith('#'):
                          continue
                      total += 1
              return total

          current = implementation_loc(Path('src/fusdb'))
          with tempfile.TemporaryDirectory() as tmp:
              subprocess.run(['git', 'worktree', 'add', '--detach', tmp, BASE], check=True, stdout=subprocess.DEVNULL)
              try:
                  baseline = implementation_loc(Path(tmp) / 'src/fusdb')
              finally:
                  subprocess.run(['git', 'worktree', 'remove', '--force', tmp], check=True, stdout=subprocess.DEVNULL)
          print(f'BASELINE_SHA={BASE}')
          print(f'BASELINE_IMPLEMENTATION_LOC={baseline}')
          print(f'BRANCH_IMPLEMENTATION_LOC={current}')
          print(f'IMPLEMENTATION_LOC_DELTA={current-baseline}')
          PY
          printf '\nPYTEST_EXIT_CODE=%s\n' "$code" >> .architecture-refactor-validation.txt
          printf '\n--- PYTEST TAIL ---\n' >> .architecture-refactor-validation.txt
          tail -n 120 /tmp/pytest.log >> .architecture-refactor-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete architecture simplification passes'
          git push origin HEAD:refactor/architecture-simplification-20260817
          exit "$code"
