name: Validate architecture refactor final

on:
  push:
    branches:
      - refactor/architecture-simplification-20260817

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/architecture-simplification-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run full test suite and record result
        shell: bash
        run: |
          set +e
          python -m pytest > /tmp/pytest.log 2>&1
          code=$?
          set -e
          mkdir -p /tmp/fusdb-baseline
          git archive 5c972650777afe97d344c7097c8a5215df599af5 src/fusdb | tar -x -C /tmp/fusdb-baseline
          python - <<'PY' > .architecture-refactor-validation.txt
          import ast
          from pathlib import Path

          def implementation_loc(root: Path) -> int:
              total = 0
              for path in root.rglob('*.py'):
                  text = path.read_text(encoding='utf-8')
                  lines = text.splitlines()
                  tree = ast.parse(text)
                  doc_lines = set()
                  for node in ast.walk(tree):
                      body = getattr(node, 'body', None)
                      if isinstance(body, list) and body:
                          first = body[0]
                          if isinstance(first, ast.Expr) and isinstance(first.value, ast.Constant) and isinstance(first.value.value, str):
                              doc_lines.update(range(first.lineno, (first.end_lineno or first.lineno) + 1))
                  for lineno, line in enumerate(lines, 1):
                      stripped = line.strip()
                      if stripped and lineno not in doc_lines and not stripped.startswith('#'):
                          total += 1
              return total

          baseline = implementation_loc(Path('/tmp/fusdb-baseline/src/fusdb'))
          current = implementation_loc(Path('src/fusdb'))
          print('BASELINE_SHA=5c972650777afe97d344c7097c8a5215df599af5')
          print(f'BASELINE_IMPLEMENTATION_LOC={baseline}')
          print(f'BRANCH_IMPLEMENTATION_LOC={current}')
          print(f'IMPLEMENTATION_LOC_DELTA={current-baseline}')
          PY
          printf '\nPYTEST_EXIT_CODE=%s\n' "$code" >> .architecture-refactor-validation.txt
          printf '\n--- PYTEST TAIL ---\n' >> .architecture-refactor-validation.txt
          tail -n 160 /tmp/pytest.log >> .architecture-refactor-validation.txt
          rm -f .github/workflows/validate-architecture-refactor-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: record final architecture refactor validation'
          git push origin HEAD:refactor/architecture-simplification-20260817
          exit "$code"
