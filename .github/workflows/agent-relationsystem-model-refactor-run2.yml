name: RelationSystem model refactor run 2

on:
  push:
    branches:
      - agent/relationsystem-model-refactor-work
    paths:
      - .github/workflows/agent-relationsystem-model-refactor-run2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python .github/agent_relationsystem_model_refactor.py
          python .github/agent_relationsystem_model_fix.py
      - run: python -m pip install -e '.[test]' >/dev/null 2>&1
      - name: Architecture contracts
        run: |
          python -m pytest \
            tests/test_relation_system_compile_plan.py \
            tests/test_relation_graph_centralization.py \
            tests/test_public_api.py \
            tests/test_coordinate_domain_rows.py \
            tests/test_popcon_source_profiles.py \
            tests/test_popcon_source_profile_mappings.py
      - name: Full suite
        run: python -m pytest
      - run: git diff --check
      - name: Commit validated work tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'refactor: make RelationSystem own prepared model state'
          git push
