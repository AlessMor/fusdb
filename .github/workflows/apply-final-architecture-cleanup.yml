name: Apply final architecture cleanup

on:
  push:
    branches:
      - refactor/architecture-simplification-20260817

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/architecture-simplification-20260817
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/finalize_architecture_refactor.py
      - name: Remove transient tooling and commit
        run: |
          rm -f tools/finalize_architecture_refactor.py
          rm -f .github/workflows/apply-final-architecture-cleanup.yml
          rm -f .github/workflows/finalize-architecture-refactor-once.yml
          rm -f .github/workflows/diagnose-architecture-refactor-once.yml
          rm -f .github/workflows/validate-architecture-refactor-once.yml
          rm -f .architecture-refactor-ci-pass .architecture-refactor-test.log .architecture-refactor-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: finish constraint normalization pass'
          git push origin HEAD:refactor/architecture-simplification-20260817
