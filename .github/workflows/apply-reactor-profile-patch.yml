name: Apply Reactor Profile Patch

on:
  push:
    branches:
      - agent/profile-coordinate-refactor

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/profile-coordinate-refactor
          fetch-depth: 0
      - name: Apply patch and clean temporary patch machinery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          git apply --check patches/reactor-profile-integration.patch
          rc=$?
          if [ "$rc" -ne 0 ]; then
            curl -sS -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
              -d '{"state":"failure","context":"fusdb/reactor-patch-apply","description":"git apply --check failed"}' >/dev/null
            exit "$rc"
          fi
          git apply patches/reactor-profile-integration.patch
          rm patches/reactor-profile-integration.patch
          rm .github/workflows/apply-reactor-profile-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: wire source profiles into reactor"
          git push origin HEAD:agent/profile-coordinate-refactor
          rc=$?
          if [ "$rc" -eq 0 ]; then state=success; description="reactor profile patch applied"; else state=failure; description="reactor profile patch push failed"; fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"fusdb/reactor-patch-apply\",\"description\":\"$description\"}" >/dev/null
          exit "$rc"
