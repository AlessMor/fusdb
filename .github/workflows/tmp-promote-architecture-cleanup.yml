name: Temporary promote architecture cleanup

on:
  push:
    branches:
      - tmp/architecture-cleanup-promote-20260818

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finish cleanup candidate
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          def remove_top_level(path: Path, name: str) -> None:
              text = path.read_text(encoding='utf-8')
              tree = ast.parse(text)
              node = next((n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name), None)
              if node is None:
                  return
              lines = text.splitlines(keepends=True)
              start = node.lineno - 1
              end = node.end_lineno or node.lineno
              while end < len(lines) and not lines[end].strip():
                  end += 1
              path.write_text(''.join(lines[:start] + lines[end:]), encoding='utf-8')

          Path('.tmp-cleanup-validation3.txt').unlink(missing_ok=True)

          # Pin the accepted empty-tag behavior in the ordinary registry test suite.
          test_path = Path('tests/test_relation_registry_build.py')
          text = test_path.read_text(encoding='utf-8')
          text = text.replace(
              'from fusdb.registry import RELATIONS, RelationRegistry, VariableRegistry\n',
              'from fusdb.registry import RELATIONS, RelationRegistry, TagRegistry, VariableRegistry\n',
              1,
          )
          test = '''\n\ndef test_empty_reactor_tags_select_only_unscoped_relations():\n    tags = TagRegistry({\"device\": [\"tokamak\"], \"descriptive\": [\"profile\"]})\n\n    assert tags.relation_matches((), ())\n    assert tags.relation_matches((\"profile\",), ())\n    assert not tags.relation_matches((\"tokamak\",), ())\n    assert not tags.relation_matches((\"tokamak\", \"profile\"), ())\n    assert tags.relation_matches((\"tokamak\",), (\"tokamak\",))\n'''
          if 'test_empty_reactor_tags_select_only_unscoped_relations' not in text:
              text = text.rstrip() + test + '\n'
          test_path.write_text(text, encoding='utf-8')

          # Inline tiny single-use presentation/serialization predicates rather
          # than retaining wrappers that only rename one expression.
          popcon = Path('src/fusdb/modes/popcon.py')
          remove_top_level(popcon, '_relation_worker_item')
          text = popcon.read_text(encoding='utf-8')
          text = text.replace(
              '        "relations": [_relation_worker_item(rel) for rel in system.model.candidate_primary_relations],\n',
              '        "relations": [rel if rel.source_kind == "source_profile" else rel.name for rel in system.model.candidate_primary_relations],\n',
              1,
          )
          popcon.write_text(text, encoding='utf-8')

          atomic = Path('src/fusdb/plotting/atomic_physics.py')
          for name in ('_is_rate_relation', '_species_label', '_category_from_module_parts'):
              remove_top_level(atomic, name)
          text = atomic.read_text(encoding='utf-8')
          text = text.replace(
              '        if not _is_rate_relation(relation):\n            continue\n',
              '        outputs = relation.outputs\n        if not (\n            "atomic_physics" in relation.tags\n            and set(relation.input_names) in ({"T_edge"}, {"T_edge", "n_e_edge"})\n            and len(outputs) == 1\n            and outputs[0].endswith("_rate")\n        ):\n            continue\n',
              1,
          )
          text = text.replace(
              '        category = _category_from_module_parts(module_parts)\n        species = _species_label(module_parts[-1])\n',
              '        category = "mar" if "mar" in module_parts else (module_parts[-2] if len(module_parts) >= 2 else "other")\n        species = module_parts[-1].replace("_plus", "+").replace("_minus", "-")\n',
              1,
          )
          atomic.write_text(text, encoding='utf-8')

          reactivity = Path('src/fusdb/plotting/reactivity.py')
          remove_top_level(reactivity, '_is_reactivity_relation')
          text = reactivity.read_text(encoding='utf-8')
          text = text.replace(
              '        if not _is_reactivity_relation(relation):\n            continue\n',
              '        outputs = relation.outputs\n        if not (relation.input_names == ("T_i",) and len(outputs) == 1 and outputs[0].startswith("sigmav_")):\n            continue\n',
              1,
          )
          reactivity.write_text(text, encoding='utf-8')

          graph = Path('src/fusdb/plotting/relation_graph.py')
          remove_top_level(graph, '_short_label')
          text = graph.read_text(encoding='utf-8')
          text = text.replace(
              '                "short_label": _short_label(data["label"]),\n',
              '                "short_label": data["label"] if len(data["label"]) <= 6 else f"{data[\'label\'][:6]}...",\n',
              1,
          )
          graph.write_text(text, encoding='utf-8')

          for path in [*Path('src').rglob('*.py'), *Path('tests').rglob('*.py')]:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Targeted tests
        run: |
          python -m pytest -q \
            tests/test_relation_registry_build.py \
            tests/test_plotting_data.py \
            tests/test_popcon_source_profiles.py \
            tests/test_popcon_source_profile_mappings.py
      - name: Full suite
        run: python -m pytest
      - name: Commit validated cleanup
        if: success()
        run: |
          rm -f .github/workflows/tmp-promote-architecture-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: clean presentation tags and temporary machinery'
          git push origin HEAD:tmp/architecture-cleanup-promote-20260818
