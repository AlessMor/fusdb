name: PROCESS He3 Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Publish He3 diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY' > /tmp/probe.txt
          import sys
          import numpy as np
          sys.path.insert(0, "tests/PROCESS_large_tokamak")
          from _process_fixture import build_reactor, plasma_variants
          reactor = build_reactor(plasma_variants()["kappa_1.750e+00"])
          result = reactor.reconcile()
          system = reactor.last_system
          values = result["values"]
          roles = system.reported_roles()
          providers = system.compiler_report["derived_provider_by_output"]
          defaults = system.compiler_report["default_provider_outputs"]
          print("roles=" + ",".join(f"{n}:{roles.get(n)}" for n in ("f_He3","n_He3","n_He3_avg","tau_p")))
          print("providers=" + ",".join(f"{n}:{providers.get(n) or defaults.get(n)}" for n in ("f_He3","n_He3","n_He3_avg")))
          print(f"values=fHe3:{float(values.get('f_He3',-1)):.6g},nHe3avg:{float(np.mean(values.get('n_He3',[-1]))):.6g},PHe3He3:{float(values.get('P_fus_He3He3',-1)):.6g}")
          PY
          while IFS= read -r line; do
            prefix=${line%%=*}
            value=${line#*=}
            curl -sS -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
              -d "{\"state\":\"success\",\"context\":\"fusdb/diag/he3-$prefix/$value\",\"description\":\"PROCESS He3 diagnostic\"}" >/dev/null
          done < /tmp/probe.txt
