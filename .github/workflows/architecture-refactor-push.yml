name: Architecture refactor push

on:
  push:
    branches:
      - refactor/architecture-simplification-20260817

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v5
        with:
          ref: refactor/architecture-simplification-20260817
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply staged refactor
        run: |
          python tools/apply_architecture_refactor.py
          rm -f .github/workflows/architecture-refactor-push.yml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run focused refactor tests
        run: |
          python -m pytest \
            tests/test_profile_source_system.py \
            tests/test_popcon_source_profiles.py \
            tests/test_profile_system_builder.py

      - name: Run full test suite
        run: python -m pytest

      - name: Commit validated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: simplify worker serialization and constraints'
          git push origin HEAD:refactor/architecture-simplification-20260817
