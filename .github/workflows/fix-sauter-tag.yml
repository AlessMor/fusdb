name: Apply Sauter relation tag fix

on:
  push:
    branches:
      - agent/profile-coordinate-refactor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/profile-coordinate-refactor
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Remove undeclared descriptive tag
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/fusdb/relations/geometry/profile_coordinates.py')
          text = path.read_text()
          old = 'tags=("geometry", "tokamak", "default", "sauter"),'
          new = 'tags=("geometry", "tokamak", "default"),'
          if old not in text:
              raise SystemExit('Sauter tag target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify new mapping tests
        run: |
          python -m pip install -e ".[test]"
          python -m pytest tests/test_sauter_profile_volume_mapping.py
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/fix-sauter-tag.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fusdb/relations/geometry/profile_coordinates.py .github/workflows/fix-sauter-tag.yml
          git commit -m "fix: keep Sauter mapping within declared relation tags"
          git push origin HEAD:agent/profile-coordinate-refactor
