  A_p:
    value: 257
    unit: m^2
  # --- Pulse, stored energy, and plant performance --------------------------
  # P_ICRF is deliberately NOT declared. The paper reports P_RF,max (coupled) = 50 MW, a
  # machine CAPABILITY, whereas fusdb's P_ICRF is the coupled power actually absorbed --
  # the earlier transcription of 50 MW into P_ICRF stated a maximum as an operating value.
  # Enforcing the limit would need an inequality relation, a different construct from the
  # 'Total auxiliary power' sum.
  # The absent channels (P_NBI/P_LHCD/P_ECRH) are NOT declared as zero either, though ICRF
  # is this machine's only auxiliary system. MEASURED 2026-08-13: declaring them activates
  # the sum, whose only consumer of P_ICRF is the sum itself -- P_ICRF is a LEAF that no
  # physics reads -- so it derives P_ICRF = P_aux as a tautology. Identical physics to four
  # digits (P_aux 21.5 MW, P_fus 1124.6 MW, Q 52.26, T_e 10.9 keV), at the cost of 2 extra
  # solver unknowns whose slack ABSORBS 3 contradictions that are otherwise reported
  # (34 failed relations declared vs 37 pruned). Auxiliary power enters here as P_aux.
  max_flattop_duration:
    value: 900
    unit: s
  tau_pulse:
    value: 900
    unit: s
  total_flux_available_from_CS:
    value: 215
    unit: Wb
  W_th:
    value: 231
    unit: MJ
  # Disruption Monte-Carlo thermal-energy distribution: 240 ± 10 MJ, hard
  # limits 150–260 MJ (Sweeney et al. (2026), p. 27).
  P_fus:
    value: 1133
    unit: MW
  # Other reported values/ranges: 1130 MW target; ~600–1300 MW model span;
  # 677 MW PORTALS-CGYRO; 879/895/1295 MW TRANSP+PORTALS/ASTRA/TORAX;
  # 1240 MW and ~565 MW for ±20% pedestal pressure; 698–1134 MW for the
  # pedestal Ti/Te scan (Hillesheim et al. (2026), pp. 10–11, 13; Howard et al.
  # (2026), pp. 1, 4, 13–15, 20).
  P_elec_tot:
    value: 400
    unit: MW
  # This is the reported net electrical output; fusdb's canonical registry name
  # is P_elec_tot and its legacy alias is P_e_net. Gross output is ~500 MW
  # (Hillesheim et al. (2026), p. 13).
  Q_sci: 51
  # Other reported gain values: 50 and ~51; 55.3 for +20% pedestal pressure
  # (Hillesheim et al. (2026), p. 10; Howard et al. (2026), pp. 5, 14).
  P_th_tot:
    value: 1260
    unit: MW
  # Cycle-averaged thermal power: 1180 MW (Hillesheim et al. (2026), p. 13).
  eta_th:
    value: 0.42
  P_aux_el:
    value: 100
    unit: MW
  # Plant internal consumption estimate; source is Hillesheim et al. (2026), p. 13.
  # --- Plasma state and confinement -----------------------------------------
  T_e_avg:
    value: 11.4
    unit: keV
  # Other model-point values: 9.13, 9.9, 10.1, and 11.7 keV (Howard et al.
  # (2026), p. 13); disruption reference value: 11 keV (Sweeney et al. (2026), p. 3).
  T_i_avg:
    value: 10.3
    unit: keV
  # Other model-point values: 8.4, 8.9, 9.1, and 10.1 keV (Howard et al.
  # (2026), p. 13); seeded scan means: 8.6 ± 0.57 and 9.3 ± 0.57 keV
  # (Muraca et al. (2026), p. 16).
  n_e_avg:
    value: 2.44e20
    unit: m^-3
  # Other model-point values: 2.34, 2.40, 2.47, and 2.56 × 10^20 m^-3
  # (Howard et al. (2026), p. 13); seeded scan means: (2.41–2.44) × 10^20 m^-3
  # (Muraca et al. (2026), p. 16).
  f_GW: 0.9
  # Other model values: 0.86, 0.88, and 0.89; scan ranges 0.5–0.95 and
  # ~0.82–0.97 (Muraca et al. (2026), pp. 6–7; Howard et al. (2026), p. 13).
  tau_E:
    value: 0.93
    unit: s
  # Other model-point values: 0.98, 1.11, 1.15, and 1.26 s (Howard et al. (2026), p. 13).
  H98_y2: 0.9
  # Other model values: 0.80, 0.87, 0.93, 0.94, and 0.98 (Howard et al. (2026), pp. 13–14).
  ion_to_electron_temp_ratio:
    value: 0.9
  qstar: 3.23
  # Other reported cylindrical-safety-factor values: 3.0, 3.2, 3.5, and 3.8
  # (Howard et al. (2026), p. 4; Eich et al. (2026), p. 23).
  q95: 3.7  # Howard et al. (2026), p. 4; Hillesheim et al. (2026) gives ~3.4–3.6 implied by q* (p. 12).
  q_cyl:
    value: 3.2
  q0:
    value: 0.75
  Z_eff: 1.52
  # Other reported values: 1.5 (Howard et al. (2026), p. 5; Leuthold et al. (2026), p. 3).
  dilution:
    value: 0.85
  density_peaking: 1.52
  # Seeded scan means: 1.34 ± 0.04 (Ar) and 1.29 ± 0.01 (Ne) (Muraca et al. (2026), p. 16).
  ion_density_peaking:
    value: 1.42
  beta_N: 0.018  # Reported βN=1.8; fusdb stores normalized beta as a fraction.
  # Other reported βN values: 1.29, 1.51, 1.58, 1.80, 1.95, and 1.65
  # (Howard et al. (2026), p. 13; Leuthold et al. (2026), p. 9).
  rho_star:
    value: 0.0017
  # On-axis alternative: ~0.0016 (Leuthold et al. (2026), p. 13).
  nu_star:
    value: 0.031
