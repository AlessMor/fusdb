    unit: m
  # a scan: 1.05–1.27 m (Muraca et al. (2026), p. 6).
  eps:
    value: 0.26
  B0:
    value: 11.4
    unit: T
  # Other reported ARC-class BT values: 9.8–11.7 T (Muraca et al. (2026), p. 6).
  I_p:
    value: 12.0
    unit: MA
  # ARC-class Ip scan: 10.0–13.8 MA; exhaust cases also use 11 and 10 MA
  # (Muraca et al. (2026), p. 6; Eich et al. (2026), pp. 18, 23).
  kappa_separatrix:
    value: 1.8
  # ARC-class elongation scan: 1.69–1.9 (Muraca et al. (2026), p. 6).
  kappa:
