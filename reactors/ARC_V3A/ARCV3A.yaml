relations:
  # Three tag-selected providers are replaced by better-suited members of their
  # own families.  In each case the swap is a MODEL choice among alternatives
  # fusdb already ships -- no relation is added, none is rewritten, and the
  # block is reactor-local, so no other reactor is affected.
  #
  # None of these resolves ARC V3A's root contradictions (`A_p` = 257 m^2 is
  # unreachable at any triangularity; `q_cyl`, `kappa_95` and `eps` are pinned
  # against values fusdb's own closures disagree with).  They reduce the SIZE
  # of the disagreement, not its existence: the failed-relation count is
  # unchanged at 38.
  #
  # Percentages below are each formula evaluated at ARC V3A's own DECLARED
  # inputs, against the declared value of the variable it produces, so they can
  # be re-derived from this file alone.
  include:

  # --- SOL_momentum_loss_fraction, declared 0.5 (Eich et al. (2026)) --------
  # All six providers in this family take the IDENTICAL argument
  # (target_electron_temp = 2 eV here), so nothing structural distinguishes
  # them -- the choice is purely which detachment correlation describes this
  # machine, exactly the situation STEP_2024 handles by name for elongation.
  #   PerezH        0.5386   +7.7%   <- selected, the only one near the declared value
  #   PerezL        0.4248  -15.0%
  #   Sang          0.3137  -37.3%
  #   Moulton       0.1960  -60.8%
  #   KotovReiter   0.1646  -67.1%   <- was active; the declared 0.5 is 335 tolerances away
  #   Jarvinen      0.0844  -83.1%
  - SOL momentum loss fraction PerezH

  # --- beta_norm_max, declared 0.032 (Muraca et al. (2026)) ----------------
  # Wesson reads `internal_inductivity`, whose only producer reads `q_cyl` --
  # and ARC V3A's declared q_cyl (3.2) disagrees with what fusdb computes from
  # the same declaration (2.654).  Wesson therefore INHERITS that disagreement
  # before it starts.  Menard reads `eps` directly and is not downstream of it.
  #   Menard        0.03474  +8.6%   <- selected
  #   original      0.02821 -11.8%
  #   Stambaugh     0.009316 -70.9%
  #   Wesson        0.06067  +89.6%  <- was active, the worst of the four
  - Normalised beta limit (Menard)

  # --- lambda_q, declared 0.72 mm (Eich et al. (2026)) ---------------------
  # Eich 15 reads `B_pol_out_mid`, which carries the SAME kind of disagreement
  # (2.0 T declared against 2.034 T from mu0*I_p/(2*pi*a)).  Eich 9 reads
  # (B0, qstar, P_sep) instead.  This is a trade rather than a clean escape --
  # `qstar` is itself contradicted -- but Eich 9 lands far closer both at the
  # declared point and at the solved one (its residual there is 2.6 tolerances
  # against Eich 15's 32.9).
  #   Eich regression 9    0.5663 mm  -21.3%   <- selected
  #   Eich regression 15   0.3915 mm  -45.6%   <- was active
  #   Brunner              0.3647 mm  -49.4%
  #   Eich regression 14   0.2761 mm  -61.7%
  - SOL lambda_q Eich regression 9

  exclude:
  # Each is the whitelisted default its replacement above supersedes; without
  # the exclusion both would stay active and contradict each other.
  - SOL momentum loss fraction KotovReiter
  - Normalised beta limit (Wesson)
  - SOL lambda_q Eich regression 15

  # HISTORICAL MEASUREMENT, no longer reproducible from this file.  When these
  # swaps landed, ARC V3A still carried 55 `fixed: true` anchors and the three
  # of them cut the whole-solve sum of squared tolerance-normalised residuals
  # 282762 -> 150341 (-46.8%) with failed relations 38, inputs beyond tolerance
  # 20, P_fus 1125.1 MW and delta 0.5512 all unchanged; PerezH alone moved the
  # max residual 335.4 -> 200.5.  Those anchors have since been removed, so the
  # figures above describe a configuration this file no longer has -- they are
  # kept as the rationale for the choice, not as a current claim.  The reasoning
  # itself still holds: it rests on which INPUTS each provider reads, not on
  # whether those inputs happen to be pinned.
