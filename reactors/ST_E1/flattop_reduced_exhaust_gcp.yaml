  R: {value: 5.0, unit: m}
  A: 2.3
  kappa: 2.42
  delta: 0.5
  B0: {value: 5.25, unit: T}

  I_p: {value: 13.6, unit: MA}
  P_fus: {value: 1500, unit: MW}
  P_aux: {value: 100, unit: MW}
  Q_sci: 15.0
  f_BS: 0.86
  beta_N: 0.0336
  beta_p: 2.13
  Z_eff: 3.49
  f_rad: 0.69
  q95: 9.95
  internal_inductivity: 0.42
  P_LH: {value: 122.5, unit: MW}
  P_sep: {value: 125, unit: MW}
  ratio_of_P_SOL_to_P_LH: 1.02
  P_elec_tot: {value: 450, unit: MW}

