metadata:
  id: ST_E1_2026_FLATTOP_REDUCED_EXHAUST_GCP
  name: ST-E1 flat-top - reduced exhaust GCP
  organization: Tokamak Energy
  country: GBR
  year: 2026
  doi: 10.1088/1741-4326/ae5f33
  notes: >-
    High-density GCP reference flat-top from McNamara et al. (2026), table 9,
    with reduced scrape-off-layer power loading PSOL/R=25 MW/m. This requires a
    high core-radiation fraction and leaves only a small margin above the L-H
    threshold (PSOL/PLH about 1.02).
  reactor_family: ST-E1

tags:
- tokamak
- spherical_tokamak
- h_mode

