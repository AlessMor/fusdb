metadata:
  id: ST_E1_2026_FLATTOP_LOW_DENSITY_GCP
  name: ST-E1 flat-top - low density GCP
  organization: Tokamak Energy
  country: GBR
  year: 2026
  doi: 10.1088/1741-4326/ae5f33
  notes: >-
    Low-density gyrokinetic-constrained-pedestal (GCP) reference flat-top from
    McNamara et al. (2026), table 9. It has similar global performance to the
    low-density BCP point but is substantially more controllable in double-null.
  reactor_family: ST-E1

tags:
- tokamak
- spherical_tokamak
- h_mode

