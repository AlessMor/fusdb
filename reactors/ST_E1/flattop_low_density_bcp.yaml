metadata:
  id: ST_E1_2026_FLATTOP_LOW_DENSITY_BCP
  name: ST-E1 flat-top - low density BCP
  organization: Tokamak Energy
  country: GBR
  year: 2026
  doi: 10.1088/1741-4326/ae5f33
  notes: >-
    Low-density ballooning-constrained-pedestal (BCP) reference flat-top from
    McNamara et al. (2026), table 9. The paper finds a strongly unstable n=0
    X-point-localised mode for this case and indicates that single-null operation
    may be required; it is retained as a published reference point, not promoted
    to the preferred ST-E1 operating scenario.
  reactor_family: ST-E1

tags:
- tokamak
- spherical_tokamak
- h_mode

