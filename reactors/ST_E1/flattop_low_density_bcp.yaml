metadata:
  id: ST_E1_2026_FLATTOP_LOW_DENSITY_BCP
  name: ST-E1 flat-top - low density BCP
  organization: Tokamak Energy
  country: GBR
  year: 2026
  doi: 10.1088/1741-4326/ae5f33
  notes: >-
    Low-density ballooning-constrained-pedestal (BCP) reference flat-top from
    McNamara et al. (2026), table 9. The paper finds a strongly unstable n=0
    X-point-localised mode for this case and indicates that single-null operation
    may be required; it is retained as a published reference point, not promoted
    to the preferred ST-E1 operating scenario.
  reactor_family: ST-E1

tags:
- tokamak
- spherical_tokamak
- h_mode

variables:
  # Machine pinned: these are single-valued design points, and leaving them
  # movable lets the solve trade geometry away instead of naming the conflict.
  R: {value: 5.0, unit: m, fixed: true}
  A: {value: 2.3, fixed: true}
  kappa: {value: 2.42, fixed: true}
  delta: {value: 0.5, fixed: true}
  B0: {value: 5.25, unit: T, fixed: true}

  I_p: {value: 14.0, unit: MA, fixed: true}
  P_fus: {value: 1500, unit: MW}
  P_aux: {value: 75, unit: MW}
  Q_sci: 20.0
  f_BS: 0.81
  beta_N: 0.0367
  beta_p: 2.29
  Z_eff: 2.79
  f_rad: 0.47
  q95: 10.63
  internal_inductivity: 0.43
  P_LH: {value: 91.8, unit: MW}
  P_sep: {value: 200, unit: MW}
  ratio_of_P_SOL_to_P_LH: 2.18
  P_elec_tot: {value: 500, unit: MW}

  # Core plasma state, McNamara et al. (2026) table 9 -- the same rows listed
  # below as comments, under the names FusDB knows them by. Without these the
  # fusion-power chain has no anchor and the solve walks to a dead plasma.
  n_la: {value: 8.78e19, unit: m^-3}
  c_Ar: 0.003
  c_Xe: 0.00035
  q0: 2.51
  q_min: 2.2

  # Table-9 quantities kept source-explicit rather than mapped to non-equivalent
  # FusDB scalars:
  # H98_star: 1.59  # radiation-corrected ITER98(y,2) enhancement
  # H_Petty08_star: 0.88
  # beta_N_no_wall: 3.15
  # beta_T_percent: 4.69
  # f_GW_line_average: 1.00
  # f_GW_pedestal: 0.74
  # T_i0: 38.94 keV
  # T_e0: 30.28 keV
  # T_i0_over_T_e0: 1.29
  # P_sep_over_R: 40 MW/m

relations:
  # ST-E1 publishes its elongation and triangularity directly. Do not let
  # aspect-ratio-only ST empirical fits compete with those declared values.
  exclude:
  - ST elongation vs aspect ratio
  - ST triangularity vs aspect ratio
