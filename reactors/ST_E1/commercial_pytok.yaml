metadata:
  id: ST_E1_2026_COMMERCIAL_PYTOK
  name: ST-E1 Commercial PyTok design point
  organization: Tokamak Energy
  country: GBR
  year: 2026
  doi: 10.1088/1741-4326/ae5d55
  notes: >-
    Commercial-phase evolution of the ST-E1 Pilot RDP from Wilson et al. (2026),
    table 5. It keeps the same permanent 5 m, A=2.3, 5.25 T power core while
    uprating the plasma and plant after the in-vessel upgrade phase.
  reactor_family: ST-E1

