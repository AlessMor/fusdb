metadata:
  id: ST_E1_2026_FLATTOP_RWM_STABLE_GCP
  name: ST-E1 flat-top - RWM-stable GCP
  organization: Tokamak Energy
  country: GBR
  year: 2026
  doi: 10.1088/1741-4326/ae5f33
  notes: >-
    High-density GCP reference flat-top from McNamara et al. (2026), table 9,
    deliberately below the no-wall beta limit so active resistive-wall-mode
    stabilization is not required. The trade is lower scientific gain and lower
    net electric output.
  reactor_family: ST-E1

tags:
- tokamak
- spherical_tokamak
- h_mode

variables:
  # Machine pinned: these are single-valued design points, and leaving them
  # movable lets the solve trade geometry away instead of naming the conflict.
  R: {value: 5.0, unit: m, fixed: true}
  A: {value: 2.3, fixed: true}
  kappa: {value: 2.42, fixed: true}
  delta: {value: 0.5, fixed: true}
  B0: {value: 5.25, unit: T, fixed: true}

  I_p: {value: 13.6, unit: MA, fixed: true}
  P_fus: {value: 1500, unit: MW}
  P_aux: {value: 150, unit: MW}
  Q_sci: 10.0
  f_BS: 0.77
  beta_N: 0.0327
  beta_p: 2.07
  Z_eff: 2.86
  f_rad: 0.56
  q95: 9.85
  internal_inductivity: 0.47
  P_LH: {value: 106.9, unit: MW}
  P_sep: {value: 200, unit: MW}
  ratio_of_P_SOL_to_P_LH: 1.87
  P_elec_tot: {value: 350, unit: MW}
  # Core plasma state, McNamara et al. (2026) table 9 -- the same rows listed
  # below as comments, under the names FusDB knows them by. Without these the
  # fusion-power chain has no anchor and the solve walks to a dead plasma.
  n_la: {value: 1.005e20, unit: m^-3}
  c_Ar: 0.003
  c_Xe: 0.0004
  q0: 2.48
  q_min: 2.2

  # H98_star: 1.32
  # H_Petty08_star: 0.72
  # beta_N_no_wall: 3.34
  # beta_T_percent: 4.04
  # f_GW_line_average: 1.25
  # f_GW_pedestal: 0.98
  # T_i0: 24.81 keV
  # T_e0: 22.49 keV
  # T_i0_over_T_e0: 1.10
  # P_sep_over_R: 40 MW/m

relations:
  # ST-E1 publishes its elongation and triangularity directly. Do not let
  # aspect-ratio-only ST empirical fits compete with those declared values.
  exclude:
  - ST elongation vs aspect ratio
  - ST triangularity vs aspect ratio
