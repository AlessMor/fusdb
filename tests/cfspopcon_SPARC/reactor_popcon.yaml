# Popcon-scan variant of reactor.yaml (the fusdb transcription of the
# cfspopcon SPARC PRD case), reconcile-native: no ordered recipe and no
# borrowed fixed ion density.  Dilution comes from quasineutrality with a
# generic impurity (Z = 6): zbar = f_D + f_T + 6 f_Imp = 1/0.854328, so the
# fractions below reproduce cfspopcon's PRD dilution
# n_i/n_e = 21.3582/25.0 = 0.854328 adirectionally -- scanning the electron
# density propagates into the ion density through the relation set, and every
# solved point is a simultaneously certified operating point.
#
# Used by tests/test_popcon_mode.py and examples/popcon_sparc.ipynb; the
# popcon mode scans average_electron_density x average_electron_temp and
# reconciles at every grid point.

metadata:
  id: SPARC_PRD_cfspopcon_popcon
  name: SPARC PRD popcon (cfspopcon)
  organization: Commonwealth Fusion Systems / cfspopcon
  year: 2020
  doi: 10.1017/S0022377820001257
  notes: >-
    Popcon variant of the phase-1 cfspopcon reproduction point: a generic
    Z=6 impurity fraction supplies the PRD dilution through quasineutrality
    so density scans are physical under reconcile.

solver_tags:
  mode: reconcile
  verbosity: false

# Same machine class as reactors/SPARC: restricts the reconcile candidate
# pool (e.g. keeps spherical_tokamak shape scalings out).
tags:
- tokamak
- compact_tokamak
- h_mode

variables:
  # --- Geometry / field (cfspopcon flat inputs, via aliases + units) ---
  major_radius: 1.85                 # R [m]
  magnetic_field_on_axis: 12.2       # B0 [T]
  inverse_aspect_ratio: 0.3081       # eps
  minor_radius: 0.569985             # a = R * eps; anchors the R_max/R_min chain
  areal_elongation: 1.75             # kappa (areal)
  delta_95: 0.3                      # triangularity_psi95
  squareness: 0.0
  I_p:
    value: 8.7
    unit: MA

  # --- Operating point (PRD coords; the popcon axes) ---
  average_electron_density:
    value: 25.0
    unit: 1e19 m^-3
  average_electron_temp:
    value: 9.13793
    unit: keV

  # --- Composition: fuel + generic Z=6 impurity giving the PRD dilution ---
  f_D: 0.4829488
  f_T: 0.4829488
  f_Imp: 0.0341024
  # Z_eff = (f_D + f_T + 36 f_Imp) / zbar for the same composition; no
  # registered producer yet, so it is supplied self-consistently.
  Z_eff: 1.8741

  # --- Profile shape factors ---
  # density_peaking is deliberately NOT supplied: the active peaking scaling
  # derives it from collisionality per point (supplying it as well would
  # over-determine the scenario away from the PRD point).
  temperature_peaking: 2.5

  # --- Confinement ---
  H98_y2: 1.0                        # confinement_time_scalar

  # --- Non-DT fusion channels (pure-DT case) ---
  P_fus_DD:
    value: 0.0
    unit: W
  P_fus_DHe3:
    value: 0.0
    unit: W
  P_fus_TT:
    value: 0.0
    unit: W
  P_fus_DDn_n:
    value: 0.0
    unit: W

relations:
  # The n_i ~ n_e default would pre-empt the quasineutrality derivation and
  # fight the supplied impurity fraction (the solver escapes by zeroing
  # f_Imp); dilution must come from the composition, not the default.
  exclude:
  - Default ion density average from plasma average density
