## Allowed species: elements at the top level, isotopes nested under them.
##
## EVERY ROW HERE IS A FULLY IONISED SPECIES -- a bare nucleus.  `atomic_number`
## is the nuclear charge Z, i.e. the charge when completely stripped, and
## `atomic_mass`/`isotopic_mass_u` are nuclear masses.  Fuel and ash (H/D/T,
## He3/He4) are assumed fully stripped in the core, which is what makes
## quasineutrality and the fusion rates exact.
##
## Impurities are the subtle case and the reason no charge state appears here:
## an impurity's actual charge is Zbar(T_e), a CONTINUOUS function from the
## Mavrin/radas fits (see `atomic_data`), not an integer.  So the row is the
## nucleus and the ionisation state is a relation, never a row.  Neutral atoms,
## partially-ionised charge states and molecules therefore do NOT belong in this
## file -- see the note at the bottom.
##
## The two keyings the code needs are expressed structurally rather than by a
## pointer field:
##   - the ELEMENT is the top-level key.  Atomic data -- radas/Mavrin Lz(T_e)
##     and Zbar(T_e) -- is set by electronic structure, so it is stated once
##     here and every isotope of the element shares it.
##   - the ISOTOPE is a key under `isotopes:`.  It states only what differs
##     from its element (mass number, isotopic mass) and INHERITS everything
##     else; anything it does state overrides the element.
## Both element and isotope rows are species: `SPECIES["He"]` is helium,
## `SPECIES["He4"]` is helium-4.  Impurities have no `isotopes:` block because
## nothing in fusdb resolves them isotopically.
##
## `symbol` is row identity, not a physical property, so it is the one field
## that never inherits.  It may be a single spelling or a list of accepted
## ones; every entry resolves to the same species (`SPECIES["H3"]` is tritium).
## It defaults to the row key, and works on ELEMENT rows as well as isotope
## ones (`SPECIES["p"]` is hydrogen).  The row's own key must come first.
##
## `atomic_data` lists the per-species datasets available in
## registry/dataset/radiation/, by their `{datatype}_{source}` stem; the
## dataset id is that stem plus `_{symbol}`.  It is the single source for which
## species each radiation/mean-charge method supports, and
## tests/test_species_registry.py asserts it matches the files on disk.

n:
  # Not an element: the free neutron, a product of DT/DD/TT/THe3.  It carries no
  # atomic number and no atomic data, but it is a reaction participant and so
  # must be a species.
  symbol: [n, neutron]
  full_name: neutron
  atomic_number: 0
  atomic_mass: 1
  isotopic_mass_u: 1.00866

H:
  full_name: hydrogen
  atomic_number: 1
  # No mass fields: like helium, the element row is the ELEMENT -- all three
  # isotopes together -- and natural hydrogen is never used as a species.  It
  # exists to carry the atomic data and to be the denominator of the isotopic
  # fractions: `c_H` is per element (n_H/n_e), `f_p`/`f_D`/`f_T` split it.
  # Radiation is set by nuclear charge and charge state, not mass, so p, D and
  # T inherit this and radiate identically per ion.  Only the PROCESS family
  # tabulates hydrogen -- the Mavrin fits and radas curves both start at He.
  atomic_data:
    - coolingcurve_PROCESS_coronal
  isotopes:
    p:
      # `p`: a fully-ionised hydrogen atom IS a proton, so the fusion products
      # spelled `p` in reactions.yaml resolve to PROTIUM, not to the element.
      # These aliases sit here and NOT on the element row: `SPECIES["p"]` must
      # mean the light isotope, never "all hydrogen", or `n_p` would silently
      # answer with `c_H`'s inventory.
      symbol: [p, protium]
      full_name: protium
      atomic_mass: 1
      isotopic_mass_u: 1.008
    D:
      # NOT `H2`/`H_2`: the AMJUEL datasets and plotting use those for molecular
      # hydrogen.  Deuterium is 2H.
      symbol: [D, 2H, 2_H]
      full_name: deuterium
      atomic_mass: 2
      isotopic_mass_u: 2.014
    T:
      symbol: [T, H3, 3H, H_3, 3_H]
      full_name: tritium
      atomic_mass: 3
      isotopic_mass_u: 3.016

He:
  full_name: helium
  atomic_number: 2
  # No mass fields: natural-abundance helium is never used as a species, only
  # its isotopes are.  The element row exists to carry the atomic data.
  atomic_data:
    - polynomialfit_mavrin_coronal
    - polynomialfit_mavrin_noncoronal
    - polynomialfit_post_jensen
    - coolingcurve_PROCESS_coronal
    - coolingcurve_radas_coronal
    - meancharge_radas_coronal
    - meansquarecharge_radas_coronal
  isotopes:
    He3:
      symbol: [He3, 3He, He_3, 3_He]
      full_name: helium-3
      atomic_mass: 3
      isotopic_mass_u: 3.016
    He4:
      symbol: [He4, 4He, He_4, 4_He]
      full_name: helium-4
      atomic_mass: 4
      isotopic_mass_u: 4.003

