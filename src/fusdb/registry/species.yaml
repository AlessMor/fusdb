# ── Charge states, neutrals and molecules ────────────────────────────────────
# Deliberately absent.  fusdb never tracks a density of a charge state: in the
# core the charge is the continuous Zbar(T_e), and on the edge/AMJUEL side the
# labels (`C_plus`, `H2`, `H2_plus`, ...) name a REACTION, not a plasma
# constituent -- they arrive as dataset metadata and as `*_rate` variables in
# variables.yaml, which is the right namespace for them.  Adding a row per
# (element, charge) would also be combinatorial: W alone has 74.
