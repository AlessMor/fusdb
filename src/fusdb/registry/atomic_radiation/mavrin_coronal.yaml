# Mavrin 2018 coronal radiative cooling-rate coefficients.
# "Improved fits of coronal radiative cooling rates for high-temperature plasmas",
# A.A. Mavrin, J. Fus. Eng. (2018). Adapted from cfspopcon; see README.md
# section "Third-party Notices".
#
# Per species: atomic_number Z, temperature_bin_borders [keV] (piecewise fit), and
# radc = polynomial coefficients (numpy.polynomial.polyval order, c0..c4) of
# log10(Lz[W*m^3]) in log10(T_e[keV]), one row per temperature bin. Valid 0.1-100 keV.
He:
  atomic_number: 2
  temperature_bin_borders: [0.0, 100.0]
  radc:
  - [-35.551, 0.31469, 0.10156, -0.09373, 0.025020]
