  domain: '[0, inf)'
  abs_tol: 1000000.0
  # CHECK gate: fusdb's Z_eff-scaled "Bremsstrahlung radiation" is the default;
  # cfspopcon's hydrogenic (Z_eff=1) form is opt-in, since it is only correct
  # alongside impurity cooling curves that already carry the impurity continuum
  # (selecting both would double-count it).  Both SPARC fixtures include the
  # cfspopcon form and exclude this one by name.
  # ONE producer: the HYDROGENIC (fuel-only) bremsstrahlung.  The impurities'
  # own bremsstrahlung is already inside the cooling-rate L_z total that
  # `P_cool_imp` carries, so the fuel-only form is the term that composes:
  #     P_rad = P_sync + P_brem(fuel) + P_cool_imp
  # The previous default made `P_brem` the TOTAL bremsstrahlung and then
  # SUBTRACTED the impurity part back out of the L_z total to form `P_line`.
  # That subtraction is structurally non-positive whenever a reactor has no
  # impurities -- P_cool_imp is then exactly 0 while P_brem_imp is a small
  # positive number -- so `P_line` went negative and tripped its [0, inf)
  # domain on DEMO_2022 and STEP_2024.  Taking each term as its own source
  # natively provides it removes the subtraction entirely.
  # `Bremsstrahlung radiation` (Z_eff-weighted TOTAL) stays available by name.
  default_relation:
  - Hydrogenic bremsstrahlung (cfspopcon)
P_cool_imp:
  default_unit: W
  aliases:
  - P_rad_impurity  # CFSPOPCON variables.yaml
  description: TOTAL impurity radiated power from a cooling-rate (L_z) table --
    line, recombination continuum and the impurities' own bremsstrahlung, all
    together. This is what Mavrin/radas/Post-Jensen/PROCESS L_z curves return, so
    they produce this rather than P_line; P_line is then derived from it by
    removing the bremsstrahlung already accounted for in P_brem.
  domain: '[0, inf)'
  abs_tol: 1000000.0
  # CHECK gate (moved here from P_line, which these relations used to produce):
  # Mavrin coronal is the default impurity-radiation method; the noncoronal,
  # Post-Jensen, PROCESS-table and radas fits are off unless explicitly included.
  default_relation:
  - Impurity line radiation (Mavrin coronal)
P_brem_imp:
  default_unit: W
  description: Bremsstrahlung radiated by the impurities alone, i.e. the total
    bremsstrahlung less its hydrogenic part.
  domain: '[0, inf)'
  abs_tol: 1000000.0
P_line:
  default_unit: W
  aliases:
  - P_rad_line
  description: Line radiated power (recombination continuum included -- the L_z
    tables it is derived from do not separate the two). Bremsstrahlung is NOT
    included; that is P_brem, which is the TOTAL bremsstrahlung.
  domain: '[0, inf)'
  abs_tol: 1000000.0
  # P_line now has exactly one producer: it is DERIVED from the impurity cooling
  # rate by removing the bremsstrahlung that P_brem already carries.  The
  # method-selection gate that used to live here (Mavrin coronal vs noncoronal vs
  # Post-Jensen vs ...) moved to P_cool_imp, which is what those relations now
  # produce.
  # ONE producer: the cooling-rate total itself, NOT the total minus the
  # impurity bremsstrahlung.  Cooling-rate tables (Mavrin, radas, Post-Jensen)
  # return line + recombination continuum + the impurities' own bremsstrahlung
  # together, and that whole quantity is what pairs with a fuel-only P_brem.
  # See the note on P_brem above for why the subtracting form was retired.
  default_relation:
  - Line radiation equals impurity cooling rate (cfspopcon convention)
impurity_residence_time:  # CHECK imported from cfspopcon (Mavrin noncoronal radiated power); CFSPOPCON variables.yaml
  default_unit: s
  description: Impurity residence time (sets ne*tau for the non-coronal cooling curves).
  domain: (0, inf)
  abs_tol: 0.001
Lz:  # CHECK imported from cfspopcon (radas coronal_Lz tables); cooling factor
  default_unit: W*m^3
  aliases:
  - cooling_factor
  - cooling_curve
  description: Coronal radiative cooling factor Lz(T_e, n_e) of a single impurity species (radiated power density = n_e * n_z * Lz).
  shape: 1
  domain: '[0, inf)'
  abs_tol: 1.0e-40
  # CHECK gate: one species' curve at a time (all producers output the same
  # variable); tungsten -- the usual dominant radiator -- is the default, the
  # other species are off unless explicitly included.
  default_relation:
  - Radas coronal cooling factor W
L_int:  # CHECK imported from cfspopcon (impurities/edge_radiator_conc); Lengyel cooling integral
  default_unit: W*m^3*eV^1.5
  description: Cooling-curve integral int(Lz*sqrt(Te) dTe) between target and separatrix temperature.
  domain: (0, inf)
  # Physical scale is ~1e-31..1e-27 (Lz ~1e-32 W*m^3 x sqrt(Te_eV) x a few hundred eV);
  # without an explicit bound the open (0, inf) domain is clamped at the generic
  # ZERO_TOL floor 1e-12, far ABOVE the physical value, making the relation unsatisfiable.
  solver_domain: '[1e-45, inf)'
  abs_tol: 1.0e-40
  # CHECK gate: Neon is the default edge radiator; N and Ar are off unless included.
  default_relation:
  - L_int cooling integral Ne
edge_impurity_concentration:  # CHECK imported from cfspopcon (impurities/edge_radiator_conc); CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: Edge impurity concentration required to cool the SOL (Lengyel model).
  domain: '[0, inf)'
  abs_tol: 0.001
edge_impurity_concentration_in_core:  # CHECK imported from cfspopcon (impurities/edge_radiator_conc); CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: Edge impurity concentration referred to the core (edge concentration / enrichment).
  domain: '[0, inf)'
  abs_tol: 0.001
edge_impurity_enrichment:  # CHECK imported from cfspopcon (impurities/edge_radiator_conc); CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: Edge-to-core enrichment factor of the seeded edge impurity.
  domain: (0, inf)
  default: 1.0
  abs_tol: 0.001
lengyel_overestimation_factor:  # CHECK imported from cfspopcon (impurities/edge_radiator_conc)
  default_unit: dimensionless
  description: Empirical correction dividing the Lengyel edge-impurity concentration (Moulton 2021).
  domain: (0, inf)
  default: 1.0
  abs_tol: 0.001
P_sync:
  aliases:
  - P_synchrotron
  - P_rad_synchrotron  # CFSPOPCON variables.yaml
  - p_plasma_sync_mw  # PROCESS physics_variables.py
  default_unit: W
  description: Synchrotron radiated power.
  domain: '[0, inf)'
  abs_tol: 1000000.0
  # CHECK gate: the cfspopcon profile-integrated synchrotron relation stays the
  # default; the PROCESS Albajar-Fidone total-power fit is off unless included.
  default_relation:
  - Synchrotron radiation
P_rad_species:
  # Line + recombination + bremsstrahlung summed over EVERY species (fuel, ash
  # and impurities) from one cooling-curve family.  The alternative to the
  # P_brem + P_line split; see P_rad's gate below.
  default_unit: W
  description: Total radiated power from all species (excludes synchrotron).
  domain: '[0, inf)'
