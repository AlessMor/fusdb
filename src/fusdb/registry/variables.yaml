  domain: '[0, 1]'
  abs_tol: 0.001
  default: 0.0
  default_requires: tau_p
Zbar_i:
  default_unit: dimensionless
  shape: 1
  average_variable: Zbar_i_avg
  # Mean charge per ion PROFILE, Zbar_i(rho) = n_plus/n_i = sum_s Z_s f_s(rho),
  # where n_plus = sum_s Z_s n_s is the positive-charge density and n_i = sum_s
  # n_s is the ion PARTICLE density.  It relates charge to particle count: only a
  # singly-charged plasma has Zbar_i = 1 and hence n_plus = n_i.  Quasineutrality
  # (n_e = n_plus) then gives the ion dilution n_i = n_e / Zbar_i.
  # This is the composition Zbar_i, uniform-at-average (= Zbar_i_avg) until the
  # species densities carry their own radial shapes, at which point it becomes
  # genuinely radial.  Dilution and the ion LEVEL read the scalar `Zbar_i_avg`,
  # so their composition denominator never comes from a density ratio (no c_Xe
  # loop).
  description: >-
    Mean charge per ion profile, Zbar_i(rho) = sum_s Z_s f_s = n_plus/n_i.
    Relates positive-charge density to ion particle density; equals 1 only for a
    singly-charged plasma.
  domain: (0, inf)
  abs_tol: 0.001
Zbar_i_avg:
  aliases:
  - mean_ion_charge
  default_unit: dimensionless
  # THE bridge between the two composition denominators.  f_s = n_s/n_i is what
  # the particle balance moves; c_s = n_s/n_e is what the atomic data needs; and
  #     c_s = f_s / Zbar_i_avg       Zbar_i_avg = n_e/n_fuel = sum_s Z_s f_s
  # is the single scalar relating them.  It is the mean charge PER FUEL ION, and
  # is NOT Z_eff: Z_eff is quadratic in the charge (sum_s Z_s^2 c_s), linear here.
  # This is the SCALAR, composition side (sum_s Z_s f_s).  Dilution and n_fuel_avg
  # read THIS one so their composition denominator never comes from a density
  # ratio.
  # The denominator is the FUEL bucket (D, T, H, He3, He4), NOT the all-ion
  # inventory -- corrected 2026-08-07, the old text said n_e/n_i and predated the
  # n_i -> n_fuel rename.  For n_e/n_i over ALL ions see `Z_bar`.
  description: >-
    Mean charge per FUEL ion, n_e/n_fuel = sum_s Z_s f_s.  Relates the two
    composition denominators: c_s = f_s / Zbar_i_avg.  Equals 1 for a pure
    hydrogenic plasma.  NOT n_e/n_i -- see `Z_bar` for the all-ion ratio.
  domain: '[1, inf)'
  abs_tol: 0.001
n_plus:
  default_unit: 1/m^3
  shape: 1
  average_variable: n_plus_avg
  # Positive-charge density, n_plus(rho) = sum_s Z_s n_s(rho): the fuel ions at
  # their nuclear charge (D, T, p at Z=1; He3, He4 at Z=2) plus the impurities
  # (c_k * Zbar_k * n_e).  Quasineutrality is the CHARGE balance n_e = n_plus,
  # NOT the particle balance n_e = n_i; the two coincide only in a singly-charged
  # (hydrogenic) plasma.  Computed from the actual species densities, so where an
  # independent ion shape (Angioni) pulls n_i off n_e it reflects that, and the
  # charge imbalance `chi_e = n_e / n_plus` departs from 1.
  description: >-
    Positive-charge density profile, sum_s Z_s n_s.  Quasineutrality is
    n_e = n_plus.
  domain: '[0, inf)'
  abs_tol: 1.0e+18
n_plus_avg:
  default_unit: 1/m^3
  description: Volume-averaged positive-charge density.
  domain: '[0, inf)'
  abs_tol: 1.0e+18
chi_e:
  default_unit: dimensionless
  shape: 1
  # Charge-imbalance RATIO, chi_e(rho) = n_e(rho) / n_plus(rho): the electron
  # density relative to the positive-charge density.  Quasineutrality is n_e =
  # n_plus, so chi_e = 1 wherever it holds -- which is everywhere the ions are
  # built to match the electrons (the quasineutrality default).  It departs from
  # 1 only where an INDEPENDENT ion shape (Angioni peaking) makes the positive
  # charge track the electrons imperfectly along the profile: that residual is
  # the local charge imbalance.  A pure DIAGNOSTIC; nothing consumes it.
  description: >-
    Charge-imbalance ratio, n_e/n_plus.  1 where quasineutrality holds, departs
    from 1 where an independent ion shape leaves a residual profile imbalance.
  domain: (0, inf)
  abs_tol: 0.001
c_H:
  # Hydrogenic counterpart of the c_* impurity concentrations, so that a single
  # species loop can cover the fuel on the same footing as the impurities.
  # Isotopes collapse: radiation is set by nuclear charge and charge state, not
  # mass, so D, T and protium share one Z=1 cooling curve and one concentration.
  default_unit: dimensionless
  description: Hydrogenic (D+T+H) ion concentration n_H/n_e for radiation.
  # NOT bounded above at 1: an undiluted D-T plasma sits EXACTLY on that
  # boundary, so f_D + f_T rounding to 1 + 2e-9 (ARC_V0, measured) trips it and
  # fails the reconcile. A domain edge must never sit on the nominal operating
  # point of a derived quantity.
  domain: '[0, inf)'
  abs_tol: 0.001
# Per-element FUEL/ash concentrations c_X = n_X/n_e, the same n_e-normalised
# footing as the impurity c_* (generic elemental convention).  Derived
# diagnostics; nothing consumes them (only c_H, the hydrogenic bundle, feeds
# radiation/Z_eff).  Domain [0, inf) for the same reason as c_H: a pure single-
# species case sits on 1 and a hard upper bound would be a knife-edge.
c_D:
  default_unit: dimensionless
  description: Deuterium concentration n_D/n_e.
  domain: '[0, inf)'
  abs_tol: 0.001
c_T:
  default_unit: dimensionless
  description: Tritium concentration n_T/n_e.
  domain: '[0, inf)'
  abs_tol: 0.001
c_p:
  default_unit: dimensionless
  description: Proton (ionised protium) concentration n_p/n_e.
  domain: '[0, inf)'
  abs_tol: 0.001
c_He3:
  default_unit: dimensionless
  description: Helium-3 concentration n_He3/n_e.
  domain: '[0, inf)'
  abs_tol: 0.001
c_He4:
  default_unit: dimensionless
  description: Helium-4 (ash) concentration n_He4/n_e.
  domain: '[0, inf)'
  abs_tol: 0.001
c_He:
  default_unit: dimensionless
  description: Helium concentration n_He/n_e for line radiation.
  domain: '[0, 1]'
  # Mirrors f_He4: the zero default only applies when there is no ash
  # balance (no tau_p).  With tau_p the helium is solved and c_He is derived
  # from it ("Helium concentration from ash densities"); holding it at 0 would
  # force n_He3_avg + n_He4_avg to zero through that link.
  #
  # ATTEMPTED 2026-08-01 and REVERTED: removing this gate does NOT make helium
  # radiate.  c_He is a kwarg CONSTANT in the radiation relations, so it prunes
  # to None rather than deriving from the bridge; making it positional instead
  # turns it into a free packed variable that runs away (measured 0.796, i.e.
  # 80% helium, P_rad 276 vs PROCESS 213 MW), and a `default_relation`
  # whitelist on the bridge did not reclaim it either.  See .claude/scratchpad.md.
  default: 0.0
  default_requires: tau_p
  abs_tol: 0.001
c_Li:
  default_unit: dimensionless
  description: Lithium concentration n_Li/n_e for line radiation.
  domain: '[0, 1]'
  default: 0.0
  default_requires: tau_p
