P_rad:
  aliases:
  - P_radiation  # CFSPOPCON variables.yaml
  - p_plasma_rad_mw  # PROCESS physics_variables.py
  default_unit: W
  description: Core radiated power (or total if not separated).
  domain: '[0, inf)'
  abs_tol: 1000000.0
  # GATE (added with the species-sum alternative): P_rad had NO whitelist, so a
  # second producer would have been enforced SIMULTANEOUSLY with the
  # P_brem+P_line+P_sync form rather than replacing it.  The split stays the
  # default; the uniform species sum is opt-in by name.
  default_relation:
  - Total radiated power
f_rad:  # CHECK imported from cfspopcon (radiated_power/basic_algorithms)
  default_unit: dimensionless
  aliases:
  - core_radiated_power_fraction  # CFSPOPCON variables.yaml
  - rad_fraction_total  # PROCESS physics_variables.py
  description: Core radiated power fraction (P_rad / P_in).
  domain: '[0, inf)'
  abs_tol: 0.001
min_P_radiation:  # CHECK imported from cfspopcon (impurities/core_radiator_conc); CFSPOPCON variables.yaml
  default_unit: W
  description: Minimum required core radiated power (target for core impurity seeding).
  domain: '[0, inf)'
  abs_tol: 1000000.0
  # CHECK gate: fraction-based target is the default; the LH-factor target is opt-in.
