# Aliases from CFSPOPCON, PROCESS plasma-physics variables, and OpenPOPCON added with inline source comments

defaults:
  rel_tol: 0.001
  abs_tol: 0.0
  profile_size: 46
R:  # OpenPOPCON src/openpopcon.py
  aliases:
  - major_radius  # CFSPOPCON variables.yaml
  - rmajor  # PROCESS physics_variables.py
  default_unit: m
  description:
  - Major radius.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
a:  # OpenPOPCON src/openpopcon.py
  aliases:
  - minor_radius  # CFSPOPCON variables.yaml
  - r_minor
  - rminor  # PROCESS physics_variables.py
  default_unit: m
  description:
  - Minor radius.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
A:
  default_unit: dimensionless
  aliases:
  - aspect_ratio
  - aspect  # PROCESS physics_variables.py
  description:
  - Aspect ratio (R/a).
  domain: (0, inf)
  solver_domain: '[1e-12, 30]'
  abs_tol: 0.001
eps:  # PROCESS physics_variables.py
  default_unit: dimensionless
  aliases:
  - epsilon
  - inverse_aspect_ratio  # CFSPOPCON variables.yaml
  description:
  - Inverse aspect ratio (a/R).
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
kappa:  # OpenPOPCON src/openpopcon.py; PROCESS physics_variables.py
  default_unit: dimensionless
  aliases:
  - elongation
  - areal_elongation  # CFSPOPCON variables.yaml
  description:
  - Elongation.
  domain: (0, inf)
  solver_domain: '[0.1, 10]'
  abs_tol: 0.001
  default: 1.0
  # CHECK gate: pre-existing producers stay the defaults; the PROCESS shape
  # scalings (STAR, Zohm, MAST, FIESTA, inductance, Menard-1997) are opt-in.
  default_relation:
  - Elongation
  - ST elongation vs aspect ratio
# NOT a kappa alias: the elongation at the separatrix differs from the areal
# elongation (SPARC: 1.97 vs 1.75); aliasing them silently overwrites kappa
# when a reactor supplies both.  Feeds the synchrotron radiation relation.
separatrix_elongation:  # CHECK imported from cfspopcon (radiated_power/synchrotron); supplied or set from geometry
  default_unit: dimensionless
  description:
  - Plasma elongation at the separatrix.
  domain: (0, inf)
  solver_domain: '[0.1, 10]'
  abs_tol: 0.001
kappa_95:
  aliases:
  - kappa95  # PROCESS physics_variables.py
  - elongation_psi95  # CFSPOPCON variables.yaml
  default_unit: dimensionless
  description:
  - Elongation at 95% flux surface.
  domain: (0, inf)
  solver_domain: '[0.1, 10]'
  abs_tol: 0.001
  # CHECK gate: IPDG89 kappa/1.12 stays the default; the PROCESS CREATE
  # EU-DEMO fit is opt-in.
  default_relation:
  - Elongation 95%
delta:  # OpenPOPCON src/openpopcon.py
  default_unit: dimensionless
  aliases:
  - triangularity
  - triang  # PROCESS physics_variables.py
  description:
  - Core triangularity.
  domain: '[-1, 1]'
  abs_tol: 0.001
  default: 0.0
  # CHECK gate: pre-existing producers stay the defaults; the PROCESS shape
  # scalings (STAR, MAST, FIESTA) are opt-in.
  default_relation:
  - Triangularity 95%
  - ST triangularity vs aspect ratio
delta_95:
  default_unit: dimensionless
  aliases:
  - triangularity_psi95
  - triang95  # CHECK PROCESS name (plasma_geometry); PROCESS physics_variables.py
  description:
  - Triangularity at 95% flux surface.
  domain: '[0, 1]'
  abs_tol: 0.001
V_p:
  nominal: 100.0
  default_unit: m^3
  aliases:
  - plasma_volume  # CFSPOPCON variables.yaml
  - vol_plasma  # CHECK PROCESS name (plasma_geometry); PROCESS physics_variables.py
  - V  # OpenPOPCON src/openpopcon.py
  description:
  - Plasma volume.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0
  # CHECK gate: Sauter volume stays the default; the PROCESS arcs volume is opt-in.
  default_relation:
  - Tokamak plasma volume
A_p:
  default_unit: m^2
  aliases:
  - plasma_surface_area  # CFSPOPCON variables.yaml
  - surface_area
  - S_p
  - a_plasma_surface  # CHECK PROCESS name (density_limit); PROCESS physics_variables.py
  description:
  - Surface area around the LCFS in the toroidal and poloidal direction.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.1
  # CHECK gate: Sauter surface stays the default; the PROCESS arcs surface is opt-in.
  default_relation:
  - Tokamak plasma surface
S_fw:
  default_unit: m^2
  aliases:
  - A_fw
  description:
  - First wall surface area.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.1
  default: A_p
S_phi:
  default_unit: m^2
  aliases:
  - plasma_cross_section
  - S_cross
  - a_plasma_poloidal  # CHECK PROCESS name (plasma_geometry); PROCESS physics_variables.py
  description:
  - Surface of the plasma cross-section in the radial and poloidal direction.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.1
  # CHECK gate: Sauter cross-section stays the default; the PROCESS arcs
  # cross-section and simplified-squareness Sauter variant are opt-in.
  default_relation:
  - Tokamak plasma cross-sectional surface
L_p:
  default_unit: m
  aliases:
  - poloidal_circumference  # CFSPOPCON variables.yaml
  - len_plasma_poloidal  # CHECK PROCESS name (plasma_fields); PROCESS physics_variables.py
  description:
  - Poloidal length around the plasma cross-section.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
  # CHECK gate: Sauter poloidal length stays the default; the PROCESS arcs
  # perimeter and simplified-squareness Sauter variant are opt-in.
  default_relation:
  - Tokamak plasma poloidal length
squareness:
  default_unit: dimensionless
  aliases:
  - xi
  - plasma_square  # CHECK PROCESS name (plasma_geometry); PROCESS physics_variables.py
  description:
  - Squareness (xi).
  domain: '[-0.5, 0.5]'
  abs_tol: 0.001
  default: 0.0
R_min:
  default_unit: m
  description:
  - Inboard major radius extent from the center of the torus.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
R_max:
  default_unit: m
  description:
  - Outboard major radius extent from the center of the torus.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
Z_min:
  default_unit: m
  description:
  - Lower vertical extent.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
Z_max:
  default_unit: m
  description:
  - Upper vertical extent.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
B:
  default_unit: T
  description:
  - Magnetic field (profile over radial direction).
  shape: 1
  average_variable: B_avg
  domain: '[0, inf)'
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B_avg:
  default_unit: T
  aliases:
  - B_vol_avg
  - average_magnetic_field  # fusdb legacy alias
  description:
  - Volume-averaged magnetic field.
  domain: '[0, inf)'
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B_rho_avg:
  default_unit: T
  aliases:
  - B_la
  - B_line_avg
  - line_average_B
  - rho_average_magnetic_field
  description:
  - Radial line-averaged magnetic field (the straight average over rho).
  domain: '[0, inf)'
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B_profile_max:
  default_unit: T
  description:
  - Maximum magnetic-field value on the supplied/reconstructed radial profile.
  domain: '[0, inf)'
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B0:  # OpenPOPCON src/openpopcon.py
  default_unit: T
  aliases:
  - magnetic_field_on_axis  # CFSPOPCON variables.yaml
  - b_plasma_toroidal_on_axis  # PROCESS physics_variables.py
  description:
  - Toroidal field on axis.
  domain: (0, inf)
  solver_domain: '[1e-12, 30]'
  abs_tol: 0.001
B_max:
  default_unit: T
  description:
  - Peak field on coil.
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B_p:
  default_unit: T
  aliases:
  - b_plasma_surface_poloidal_average  # CHECK PROCESS name (plasma_fields); PROCESS physics_variables.py
  description:
  - Poloidal field.
  domain: '[0, inf)'
  solver_domain: '[1e-12, 30]'
  abs_tol: 0.001
  # CHECK gate: the Ampere surface-average stays the default; the Peng/STAR TART
  # branch (spherical tokamaks) is opt-in.
  default_relation:
  - Surface-averaged poloidal field from plasma current
I_p:
  default_unit: A
  aliases:
  - plasma_current  # CHECK PROCESS name (plasma_fields); PROCESS uses amperes; CFSPOPCON variables.yaml; PROCESS physics_variables.py
  - Ip  # OpenPOPCON src/openpopcon.py
  description:
  - Plasma current.
  domain: '[0, inf)'
  solver_domain: '[1e-12, inf)'
  abs_tol: 10000.0
f_BS:
  default_unit: dimensionless
  aliases:
  - bootstrap_fraction  # CFSPOPCON variables.yaml
  description:
  - Bootstrap current fraction.
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
  # CHECK gate: the cfspopcon Gi (2014) bootstrap stays the default; the PROCESS
  # scalings (ITER-89, Sakai, ARIES, Andrade, Hoang, Wong, Gi-II, Sugiyama L/H,
  # Nevins, Wilson, Sauter) are off unless explicitly included.
  default_relation:
  - Bootstrap current fraction
f_NI:
  aliases:
  - f_c_plasma_non_inductive  # PROCESS physics_variables.py
  default_unit: dimensionless
  description:
  - Non-inductive current fraction.
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
f_CD:
  aliases:
  - f_c_plasma_auxiliary  # PROCESS physics_variables.py
  default_unit: dimensionless
  description:
  - Driven current fraction (excluding bootstrap).
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
q95:  # PROCESS physics_variables.py
  default_unit: dimensionless
  description:
  - Safety factor at 95% flux surface.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
q_cyl:
  aliases:
  - cylindrical_safety_factor  # CFSPOPCON variables.yaml
  - q_cylindrical
  - q_I
  default_unit: dimensionless
  description:
  - Cylindrical edge safety factor.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
qstar:  # PROCESS physics_variables.py
  aliases:
  - q_star  # CFSPOPCON variables.yaml
  default_unit: dimensionless
  description:
  - Equivalent cylindrical edge safety factor.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
f_shaping:  # CHECK imported from cfspopcon (plasma_current/safety_factor)
  default_unit: dimensionless
  description:
  - Plasma shaping function used in the q_star/plasma-current relation (ITER Physics Basis Ch.1 Eq. A-11).
  domain: (0, inf)
  solver_domain: '[1e-12, 100]'
  abs_tol: 0.001
  # CHECK gate: the cfspopcon IPB shaping function stays the default; the PROCESS
  # fq scalings (Peng, Todd I/II, Connor-Hastie, Sauter, FIESTA) are opt-in.
  default_relation:
  - Plasma shaping function for q_star
q_a:
  default_unit: dimensionless
  description:
  - Edge safety factor.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
q_min:
  default_unit: dimensionless
  description:
  - Minimum safety factor.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
li:
  default_unit: dimensionless
  description:
  - Internal inductance.
  abs_tol: 0.001
beta_N:
  default_unit: dimensionless
  aliases:
  - beta_normalized
  - normalized_beta  # CFSPOPCON variables.yaml
  - beta_norm_total  # PROCESS physics_variables.py
  - BetaN  # OpenPOPCON src/openpopcon.py
  description:
  - Normalized beta stored as a fraction (literature beta_N=3.9 is 0.039 here).
  domain: '[0, inf)'
  abs_tol: 0.0002
  solver_domain: '[0, 0.2]'
beta:
  default_unit: dimensionless
  aliases:
  - beta_total  # CFSPOPCON variables.yaml
  - beta_total_vol_avg  # PROCESS physics_variables.py
  description:
  - Total beta.
  domain: '[0, inf)'
  abs_tol: 0.0001
  solver_domain: '[0, 1]'
beta_T:
  default_unit: dimensionless
  aliases:
  - beta_toroidal  # CFSPOPCON variables.yaml
  - beta_toroidal_vol_avg  # PROCESS physics_variables.py
  description:
  - Toroidal beta (fraction).
  domain: '[0, inf)'
  solver_domain: '[0, 1]'
  abs_tol: 0.0001
beta_p:
  default_unit: dimensionless
  aliases:
  - beta_poloidal  # CFSPOPCON variables.yaml
  - beta_poloidal_vol_avg  # PROCESS physics_variables.py
  description:
  - Poloidal beta.
  domain: '[0, inf)'
  solver_domain: '[0, 10]'
  abs_tol: 0.001
beta_limit:
  default_unit: dimensionless
  description:
  - Troyon beta limit.
  domain: '[0, inf)'
  abs_tol: 0.0001
  solver_domain: '[0, 1]'
troyon_margin:
  default_unit: dimensionless
  description:
  - Margin to the Troyon beta limit.
  abs_tol: 0.0001
p_th:
  default_unit: Pa
  description:
  - Volume-averaged thermal pressure.
  aliases:
  - p_th_avg
  - p_th_vol_avg
  - p_tot_avg
  - p_tot_vol_avg
  - average_total_pressure  # CFSPOPCON variables.yaml
  - pres_plasma_thermal_vol_avg  # PROCESS physics_variables.py
  abs_tol: 1000.0
p_th_rho_avg:
  default_unit: Pa
  description:
  - Straight-rho averaged thermal pressure.
  aliases:
  - p_tot_rho_avg
  - rho_average_total_pressure
  abs_tol: 1000.0
p_peak:
  default_unit: Pa
  aliases:
  - peak_pressure  # CFSPOPCON variables.yaml
  - pres_plasma_thermal_on_axis  # PROCESS physics_variables.py
  description:
  - Peak pressure.
  abs_tol: 1000.0
W_th:
  default_unit: J
  description:
  - Thermal stored energy.
  domain: '[0, inf)'
  abs_tol: 1000000.0
T_e_avg:
  aliases:
  - T_avg
  - T_e_vol_avg
  - T_vol_avg
  - average_electron_temp  # CFSPOPCON variables.yaml
  - ten
  - temp_plasma_electron_vol_avg_kev  # PROCESS physics_variables.py
  default_unit: keV
  description:
  - Volume-averaged electron temperature.
  domain: (0, inf)
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_e_rho_avg:
  aliases:
  - T_e_la
  - T_e_line_avg
  - line_average_T_e
  - T_rho_avg
  - rho_average_electron_temp
  - temp_plasma_electron_line_avg_kev  # PROCESS physics_variables.py
  default_unit: keV
  description:
  - Radial line-averaged electron temperature (the straight average over rho).
  domain: (0, inf)
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_sep:
  aliases:
  - separatrix_electron_temp  # CFSPOPCON variables.yaml
  - temp_plasma_separatrix_kev  # PROCESS physics_variables.py
  default_unit: keV
  description:
  - Separatrix electron temperature.
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_edge:
  aliases:
  - edge_electron_temp  # CFSPOPCON variables.yaml
  - edge_electron_temperature  # CFSPOPCON variables.yaml
  default_unit: keV
  description:
  - Edge collision temperature used by AMJUEL H.2 atomic-physics rate fits.
  domain: (0, inf)
  solver_domain: '[1e-12, 300]'
  abs_tol: 1.0e-4
n_e_edge:
  aliases:
  - edge_electron_density  # CFSPOPCON variables.yaml
  default_unit: 1/m^3
  description:
  - Edge electron density used by AMJUEL H.4 atomic-physics rate fits.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
T_e:
  nominal: 5.0
  aliases:
  - T_e_prof
  - electron_temp_profile  # CFSPOPCON variables.yaml
  - Te_prof  # OpenPOPCON src/openpopcon.py
  default_unit: keV
  description:
  - Electron temperature.
  shape: 1
  average_variable: T_e_avg
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
  default_relation:
  - Parabolic electron temperature profile
  - Default electron temperature profile from average temperature
T0:
  aliases:
  - T_e_peak
  - temp_plasma_electron_on_axis_kev  # CHECK PROCESS name (radiation_power); PROCESS uses keV; PROCESS physics_variables.py
  - peak_electron_temp  # CFSPOPCON variables.yaml
  default_unit: keV
  description:
  - On-axis/peak electron temperature.
  domain: (0, inf)
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_i:
  nominal: 5.0
  aliases:
  - T_i_prof
  - ion_temp_profile  # CFSPOPCON variables.yaml
  - Ti_prof  # OpenPOPCON src/openpopcon.py
  default_unit: keV
  description:
  - Ion temperature.
  shape: 1
  average_variable: T_i_avg
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
  default_relation:
  - Parabolic ion temperature profile
  - Default ion temperature profile from average temperature
T_i_avg:
  default_unit: keV
  aliases:
  - T_i_vol_avg
  - average_ion_temp  # CFSPOPCON variables.yaml
  - temp_plasma_ion_vol_avg_kev  # PROCESS physics_variables.py
  description:
  - Volume-averaged ion temperature.
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_i_rho_avg:
  default_unit: keV
  aliases:
  - T_i_la
  - T_i_line_avg
  - line_average_T_i
  - rho_average_ion_temp
  - temp_plasma_ion_density_weighted_kev  # PROCESS physics_variables.py
  description:
  - Radial line-averaged ion temperature (the straight average over rho).
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_i_peak:
  aliases:
  - peak_ion_temp  # CFSPOPCON variables.yaml
  - temp_plasma_ion_on_axis_kev  # PROCESS physics_variables.py
  default_unit: keV
  description:
  - On-axis/peak ion temperature.
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
ion_to_electron_temp_ratio:  # CFSPOPCON variables.yaml
  aliases:
  - f_temp_plasma_ion_electron  # PROCESS physics_variables.py
  default_unit: dimensionless
  description:
  - Ratio of volume-averaged ion temperature to electron temperature.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
n_e_avg:
  aliases:
  - n_avg
  - n_e_vol_avg
  - n_vol_avg
  - average_electron_density  # CFSPOPCON variables.yaml
  - nd_plasma_electrons_vol_avg  # PROCESS physics_variables.py
  default_unit: 1/m^3
  description:
  - Volume-averaged electron density.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
n_e_rho_avg:
  aliases:
  - n_rho_avg
  - rho_average_electron_density
  default_unit: 1/m^3
  description:
  - Radial line-averaged electron density (legacy duplicate of n_la).
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
n_sep:
  aliases:
  - separatrix_electron_density  # CFSPOPCON variables.yaml
  - nd_plasma_separatrix_electron  # PROCESS physics_variables.py
  default_unit: 1/m^3
  description:
  - Separatrix electron density.
  domain: '[0, inf)'
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
nesep_over_nebar:  # CHECK imported from cfspopcon (scrape_off_layer/separatrix_density); CFSPOPCON variables.yaml
  default_unit: dimensionless
  aliases:
  - prn1  # CHECK PROCESS name (density_limit); PROCESS defines prn1 = nesep/dene
  - f_nd_plasma_separatrix_greenwald  # PROCESS physics_variables.py
  description:
  - Ratio of separatrix electron density to volume-averaged electron density.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
n_i_avg:
  aliases:
  - n_i_vol_avg
  - average_ion_density  # CFSPOPCON variables.yaml
  - nd_plasma_ions_total_vol_avg  # PROCESS physics_variables.py
  - nd_plasma_fuel_ions_vol_avg  # PROCESS physics_variables.py
  default_unit: 1/m^3
  description:
  - Volume-averaged ion (fuel) density, distinct from the electron average when
    impurity dilution is present.
  default_relation:
  - Ion density average from quasineutrality
  - Default ion density average from plasma average density
  - Ion density average from impurity concentrations (Mavrin)
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
n_i_rho_avg:
  aliases:
  - n_i_la
  - n_i_line_avg
  - line_average_n_i
  - rho_average_ion_density
  default_unit: 1/m^3
  description:
  - Radial line-averaged ion density (the straight average over rho).
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
n0:
  aliases:
  - n_e_peak
  - nd_plasma_electron_on_axis  # CHECK PROCESS name (radiation_power); PROCESS physics_variables.py
  - peak_electron_density  # CFSPOPCON variables.yaml
  default_unit: 1/m^3
  description:
  - On-axis electron density.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
n_e:
  nominal: 1.0e20
  aliases:
  - n_e_prof
  - electron_density_profile  # CFSPOPCON variables.yaml
  - ne_prof  # OpenPOPCON src/openpopcon.py
  default_unit: 1/m^3
  description:
  - Electron density.
  shape: 1
  average_variable: n_e_avg
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
  default_relation:
  - Parabolic electron density profile
  - Default electron density profile from average density
n_i:
  aliases:
  - n_i_prof
  - fuel_ion_density_profile  # CFSPOPCON variables.yaml
  - ni_prof  # OpenPOPCON src/openpopcon.py
  default_unit: 1/m^3
  description:
  - Ion density.
  shape: 1
  average_variable: n_i_avg
  domain: '[0, inf)'
  abs_tol: 1.0e+18
