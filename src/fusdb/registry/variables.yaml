# --- Per-scaling energy-confinement enhancement factors -------------------
# One H per SCALING (not per relation): implementations of the same scaling
# share an H, e.g. both IPB98(y,2) ports use H98_y2.  Each is injected as an
# optional constant by @relation(h_factor=...) and multiplies that scaling's
# raw fit, alongside the generic H_factor.  Default 1.0 = no enhancement, so
# an unsupplied H is a no-op and an H supplied for an inactive scaling is
# simply unused.
