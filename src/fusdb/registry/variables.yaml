# Aliases from CFSPOPCON, PROCESS plasma-physics variables, and OpenPOPCON added with inline source comments
defaults:
  rel_tol: 0.001
  abs_tol: 0.0
  profile_size: 46
R:  # OpenPOPCON src/openpopcon.py
  aliases:
  - major_radius  # CFSPOPCON variables.yaml
  - rmajor  # PROCESS physics_variables.py
  default_unit: m
  description: Major radius.
  domain: (0, inf)
  abs_tol: 0.001
a:  # OpenPOPCON src/openpopcon.py
  aliases:
  - minor_radius  # CFSPOPCON variables.yaml
  - r_minor
  - rminor  # PROCESS physics_variables.py
  default_unit: m
  description: Minor radius.
  domain: (0, inf)
  abs_tol: 0.001
A:
  default_unit: dimensionless
  aliases:
  - aspect_ratio
  - aspect  # PROCESS physics_variables.py
  description: Aspect ratio (R/a).
  domain: '(1, 30]'
  # Solver bound must sit INSIDE the domain: A = R/a is > 1 by definition, so
  # the old '[1e-12, 30]' lower bound was outside it and the registry refused
  # to load.  Smallest reactor aspect ratio in reactors/ is STEP_2024 at ~1.8.
  abs_tol: 0.001
eps:  # PROCESS physics_variables.py
  default_unit: dimensionless
  aliases:
  - epsilon
  - inverse_aspect_ratio  # CFSPOPCON variables.yaml
  description: Inverse aspect ratio (a/R).
  domain: (0, inf)
  abs_tol: 0.001
kappa:  # OpenPOPCON src/openpopcon.py; PROCESS physics_variables.py
  default_unit: dimensionless
  aliases:
  - elongation
  - k_geom
  - kappa_geom
  - kappa_geometric
  description: >-
    GEOMETRIC elongation of the last closed flux surface, b/a, with
    a = (R_max - R_min)/2 the horizontal minor radius and b = (Z_max - Z_min)/2
    the vertical half-height of the SMOOTH shape parameterisation. This is the
    elongation fusdb's Sauter cross-section consumes, and the one PROCESS takes
    as its `kappa` input. It is deliberately NOT kappa_separatrix: a diverted
    separatrix carries an X-point extension that raises Z_max without adding
    cross-sectional area, which a smooth parameterisation cannot represent. The
    two coincide when there is no X-point, which is what the default relation
    `Separatrix elongation from geometric elongation` assumes. See
    :cite:`zohm_2015`.
  domain: '(0, 10]'
  solver_domain: '[0.1, 10]'
  abs_tol: 0.001
  # No default: a circular plasma (kappa = 1.0) is not a weaker assumption than
  # none, it is a wrong one -- and as a seeded packed input it made S_phi
  # forward-decidable FROM kappa, so a supplied kappa_areal could never
  # back-solve kappa through the cross-section.  See NOTES.md.
  # CHECK gate: pre-existing producers stay the defaults; the PROCESS shape
  # scalings (STAR, Zohm, MAST, FIESTA, inductance, Menard-1997) are opt-in.
  default_relation:
  - Elongation
  - ST elongation vs aspect ratio
# NOT a kappa alias: the elongation at the separatrix differs from the areal
# elongation (SPARC: 1.97 vs 1.75); aliasing them silently overwrites kappa
# when a reactor supplies both.  Feeds the synchrotron radiation relation.
kappa_separatrix:  # CHECK imported from cfspopcon (radiated_power/synchrotron); supplied or set from geometry
  default_unit: dimensionless
  aliases:
  - separatrix_elongation  # CFSPOPCON variables.yaml
  - k_sep
  - kappa_sep
  description: >-
    ACTUAL elongation of the separatrix, (Z_max - Z_min)/(R_max - R_min)
    measured on the real last closed flux surface INCLUDING the X-point
    extension of a diverted plasma. This is what a magnetics reconstruction
    reports and what cfspopcon calls ``separatrix_elongation``. It exceeds the
    geometric ``kappa`` whenever the plasma is diverted -- cfspopcon's SPARC
    gives 1.96875 against an areal 1.75, a ratio no smooth shape parameterisation
    reproduces (Sauter at squareness 0 gives only 1/(1 - 0.1274 delta^2)).
    Falls back to ``kappa`` when the device does not declare it.
  domain: '(0, 10]'
  solver_domain: '[0.1, 10]'
  abs_tol: 0.001
  default_relation:
  - Separatrix elongation from geometric elongation
kappa_95:
  aliases:
  - kappa95  # PROCESS physics_variables.py
  - k_95
  - elongation_psi95  # CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: >-
    GEOMETRIC elongation at the 95% poloidal-flux surface, psi_N = 0.95. Sits
    inside the separatrix, so it is unaffected by the X-point extension that
    separates ``kappa`` from ``kappa_separatrix``, and is the elongation the
    current-profile and L-H fits are evaluated at (PROCESS ``kappa95``,
    cfspopcon ``elongation_psi95``).
  domain: '(0, 10]'
  solver_domain: '[0.1, 10]'
  abs_tol: 0.001
  # CHECK gate: IPDG89 kappa/1.12 stays the default; the PROCESS CREATE
  # EU-DEMO fit and the cfspopcon areal/psi95-ratio form are opt-in.
  #
  # NOTE 2026-07-31: cutting this to the single `Elongation 95%` entry (the
  # `density_peaking` fix applied here) WAS implemented and measured, and it
  # REGRESSED the sweep -- reverted, see .claude/scratchpad.md. The free
  # `elongation_ratio_areal_to_psi95` does prune as intended, but removing that
  # degree of freedom pushes the disagreement onto real inputs:
  #   ARC_V0  >tol 13 -> 16, nfev 38 -> 435, 6.3s -> 29.8s
  #   STEP    >tol 11 -> 13
  #   sweep total 18.4s -> 61.3s   (pytest unchanged at 292/5)
  # STEP's kappa/kappa_95 conflict (169/124 tolerances) is PRE-EXISTING and is
  # NOT rescued by the second entry -- it is present either way.
  default_relation:
  - Elongation 95%
  - Elongation at psi95 from areal elongation (cfspopcon)
elongation_ratio_sep_to_geom:
  default_unit: dimensionless
  description: >-
    Ratio of the ACTUAL separatrix elongation to the GEOMETRIC one,
    kappa_separatrix / kappa. It is 1.0 for a limited or X-point-free plasma and
    rises with the X-point extension of a diverted one -- cfspopcon's SPARC
    implies ~1.11 against fusdb's geometric kappa, and carries the same quantity
    against the areal elongation as `elongation_ratio_sep_to_areal: 1.125`.
    Defaults to 1.0, which is a PENALIZED input, not a pin: a device that
    declares both elongations determines it instead, and a device that declares
    neither never activates it.
  domain: '(0, 3]'
  solver_domain: '[0.5, 3]'
  abs_tol: 0.001
  default: 1.0
elongation_ratio_areal_to_psi95:  # CHECK imported from cfspopcon (geometry/analytical)
  default_unit: dimensionless
  description: Ratio of the areal elongation to the 95%-flux-surface elongation (kappa_areal / kappa_95); cfspopcon geometry input.
  domain: (0, inf)
  abs_tol: 0.001
delta:  # OpenPOPCON src/openpopcon.py
  default_unit: dimensionless
  aliases:
  - triangularity
  - triang  # PROCESS physics_variables.py
  description: Core triangularity.
  domain: '[-1, 1]'
  abs_tol: 0.001
  default: 0.0
  # CHECK gate: pre-existing producers stay the defaults; the PROCESS shape
  # scalings (STAR, MAST, FIESTA) are opt-in.
  default_relation:
  - Triangularity 95%
  - ST triangularity vs aspect ratio
delta_95:
  default_unit: dimensionless
  aliases:
  - triangularity_psi95
  - triang95  # CHECK PROCESS name (plasma_geometry); PROCESS physics_variables.py
  description: Triangularity at 95% flux surface.
  # Negative triangularity is a real configuration, and `delta` (= 1.5 delta_95)
  # already allows it, so the domain matches delta's rather than clipping at 0.
  domain: '[-1, 1]'
  abs_tol: 0.001
V_p:
  nominal: 100.0
  default_unit: m^3
  aliases:
  - plasma_volume  # CFSPOPCON variables.yaml
  - vol_plasma  # CHECK PROCESS name (plasma_geometry); PROCESS physics_variables.py
  - V  # OpenPOPCON src/openpopcon.py
  description: Plasma volume.
  domain: (0, inf)
  abs_tol: 1.0
  # CHECK gate: Sauter volume stays the default; the PROCESS arcs volume is opt-in.
  default_relation:
  - Tokamak plasma volume
A_p:
  default_unit: m^2
  aliases:
  - plasma_surface_area  # CFSPOPCON variables.yaml
  - surface_area
  - S_p
  - a_plasma_surface  # CHECK PROCESS name (density_limit); PROCESS physics_variables.py
  description: Surface area around the LCFS in the toroidal and poloidal direction.
  domain: (0, inf)
  abs_tol: 0.1
  # CHECK gate: Sauter surface stays the default; the PROCESS arcs surface is opt-in.
  default_relation:
  - Tokamak plasma surface
S_wall:
  default_unit: m^2
  aliases:
  - wall_surface_area
  - A_wall
  description: >-
    Plasma-facing wall surface area used for neutron and fusion-power wall
    loading. Defaults to the LCFS plasma surface area when no independent wall
    geometry is supplied.
  domain: (0, inf)
  abs_tol: 0.001
  default_relation:
  - Wall surface from plasma surface
S_fw:
  default_unit: m^2
  aliases:
  - A_fw
  description: First wall surface area.
  domain: (0, inf)
  abs_tol: 0.1
  default: A_p
S_phi:
  default_unit: m^2
  aliases:
  - plasma_cross_section
  - S_cross
  - a_plasma_poloidal  # CHECK PROCESS name (plasma_geometry); PROCESS physics_variables.py
  description: Surface of the plasma cross-section in the radial and poloidal direction.
  domain: (0, inf)
  abs_tol: 0.1
  # CHECK gate: Sauter cross-section stays the default; the PROCESS arcs
  # cross-section and simplified-squareness Sauter variant are opt-in.
  default_relation:
  - Tokamak plasma cross-sectional surface
L_p:
  default_unit: m
  aliases:
  - poloidal_circumference  # CFSPOPCON variables.yaml
  - len_plasma_poloidal  # CHECK PROCESS name (plasma_fields); PROCESS physics_variables.py
  description: Poloidal length around the plasma cross-section.
  domain: (0, inf)
  abs_tol: 0.001
  # CHECK gate: Sauter poloidal length stays the default; the PROCESS arcs
  # perimeter and simplified-squareness Sauter variant are opt-in.
  default_relation:
  - Tokamak plasma poloidal length
squareness:
  default_unit: dimensionless
  aliases:
  - xi
  - plasma_square  # CHECK PROCESS name (plasma_geometry); PROCESS physics_variables.py
  description: Squareness (xi).
  domain: '[-0.5, 0.5]'
  abs_tol: 0.001
  default: 0.0
R_min:
  default_unit: m
  description: Inboard major radius extent from the center of the torus.
  domain: (0, inf)
  abs_tol: 0.001
R_max:
  default_unit: m
  description: Outboard major radius extent from the center of the torus.
  domain: (0, inf)
  abs_tol: 0.001
Z_min:
  default_unit: m
  description: Lower vertical extent.
  domain: (0, inf)
  abs_tol: 0.001
Z_max:
  default_unit: m
  description: Upper vertical extent.
  domain: (0, inf)
  abs_tol: 0.001
B:
  default_unit: T
  description: Magnetic field (profile over radial direction).
  shape: 1
  average_variable: B_avg
  domain: '[0, 30]'
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B_avg:
  default_unit: T
  aliases:
  - B_vol_avg
  - average_magnetic_field  # fusdb legacy alias
  description: Volume-averaged magnetic field.
  domain: '[0, 30]'
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B_rho_avg:
  default_unit: T
  aliases:
  - B_la
  - B_line_avg
  - line_average_B
  - rho_average_magnetic_field
  description: Radial line-averaged magnetic field (the straight average over rho).
  domain: '[0, 30]'
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B_profile_max:
  default_unit: T
  description: Maximum magnetic-field value on the supplied/reconstructed radial profile.
  domain: '[0, 30]'
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B0:  # OpenPOPCON src/openpopcon.py
  default_unit: T
  aliases:
  - magnetic_field_on_axis  # CFSPOPCON variables.yaml
  - b_plasma_toroidal_on_axis  # PROCESS physics_variables.py
  description: Toroidal field on axis.
  domain: '(0, 30]'
  abs_tol: 0.001
B_max:
  default_unit: T
  description: Peak field on coil.
  abs_tol: 0.001
  solver_domain: '[1e-12, 30]'
B_p:
  default_unit: T
  aliases:
  - b_plasma_surface_poloidal_average  # CHECK PROCESS name (plasma_fields); PROCESS physics_variables.py
  description: Poloidal field.
  domain: '[0, 30]'
  solver_domain: '[1e-12, 30]'
  abs_tol: 0.001
  # CHECK gate: the Ampere surface-average stays the default; the Peng/STAR TART
  # branch (spherical tokamaks) is opt-in.
  default_relation:
  - Surface-averaged poloidal field from plasma current
I_p:
  default_unit: A
  aliases:
  - plasma_current  # CHECK PROCESS name (plasma_fields); PROCESS uses amperes; CFSPOPCON variables.yaml; PROCESS physics_variables.py
  - Ip  # OpenPOPCON src/openpopcon.py
  description: Plasma current.
  domain: '[0, inf)'
  solver_domain: '[1e-12, inf)'
  abs_tol: 10000.0
f_BS:
  default_unit: dimensionless
  aliases:
  - bootstrap_fraction  # CFSPOPCON variables.yaml
  description: Bootstrap current fraction.
  domain: '[0, 1]'
  abs_tol: 0.001
  # CHECK gate: the cfspopcon Gi (2014) bootstrap stays the default; the PROCESS
  # scalings (ITER-89, Sakai, ARIES, Andrade, Hoang, Wong, Gi-II, Sugiyama L/H,
  # Nevins, Wilson, Sauter) are off unless explicitly included.
  default_relation:
  - Bootstrap current fraction
f_NI:
  aliases:
  - f_c_plasma_non_inductive  # PROCESS physics_variables.py
  default_unit: dimensionless
  description: Non-inductive current fraction.
  domain: '[0, 1]'
  abs_tol: 0.001
f_CD:
  aliases:
  - f_c_plasma_auxiliary  # PROCESS physics_variables.py
  default_unit: dimensionless
  description: Driven current fraction (excluding bootstrap).
  domain: '[0, 1]'
  abs_tol: 0.001
q95:  # PROCESS physics_variables.py
  default_unit: dimensionless
  description: Safety factor at 95% flux surface.
  domain: '(0, 50]'
  abs_tol: 0.001
q_cyl:
  aliases:
  - cylindrical_safety_factor  # CFSPOPCON variables.yaml
  - q_cylindrical
  - q_I
  default_unit: dimensionless
  description: Cylindrical edge safety factor.
  domain: '(0, 50]'
  abs_tol: 0.001
qstar:  # PROCESS physics_variables.py
  aliases:
  - q_star  # CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: Equivalent cylindrical edge safety factor.
  domain: '(0, 50]'
  abs_tol: 0.001
f_shaping:  # CHECK imported from cfspopcon (plasma_current/safety_factor)
  default_unit: dimensionless
  description: Plasma shaping function used in the q_star/plasma-current relation (ITER Physics Basis Ch.1 Eq. A-11).
  domain: '(0, 100]'
  abs_tol: 0.001
  # CHECK gate: the cfspopcon IPB shaping function stays the default; the PROCESS
  # fq scalings (Peng, Todd I/II, Connor-Hastie, Sauter, FIESTA) are opt-in.
  default_relation:
  - Plasma shaping function for q_star
q_a:
  default_unit: dimensionless
  description: Edge safety factor.
  domain: '(0, 50]'
  abs_tol: 0.001
q_min:
  default_unit: dimensionless
  description: Minimum safety factor.
  domain: '(0, 50]'
  abs_tol: 0.001
li:
  default_unit: dimensionless
  description: Internal inductance.
  abs_tol: 0.001
beta_N:
  default_unit: dimensionless
  aliases:
  - beta_normalized
  - normalized_beta  # CFSPOPCON variables.yaml
  - beta_norm_total  # PROCESS physics_variables.py
  - BetaN  # OpenPOPCON src/openpopcon.py
  description: Normalized beta stored as a fraction (literature beta_N=3.9 is 0.039 here).
  domain: '[0, 0.2]'
  abs_tol: 0.0002
  # CHECK gate: fusdb normalises beta_T (Troyon) by default; cfspopcon's
  # beta_total form is opt-in (avoids a second tag-matched producer elsewhere).
  default_relation:
  - Normalized beta
beta:
  default_unit: dimensionless
  aliases:
  - beta_total  # CFSPOPCON variables.yaml
  - beta_total_vol_avg  # PROCESS physics_variables.py
  description: Total beta.
  domain: '[0, 1]'
  abs_tol: 0.0001
beta_fast_alpha:
  default_unit: dimensionless
