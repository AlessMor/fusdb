TBR:
  default_unit: dimensionless
  description:
  - Tritium breeding ratio.
  domain: '[0, inf)'
  abs_tol: 0.001
tau_E:
  default_unit: s
  aliases:
  - energy_confinement_time
  description:
  - Energy confinement time.
  default_relation:
  - tau_E_iter_ipb98y2
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.005
nu_star:
  default_unit: dimensionless
  description:
  - Normalized collisionality.
  domain: '[0, inf)'
  solver_domain: '[0, inf)'
  abs_tol: 0.001
nu_ee:
  default_unit: 1/s
  description:
  - Electron-electron collision frequency.
  domain: '[0, inf)'
  solver_domain: '[0, inf)'
  abs_tol: 1.0
nu_ei:
  default_unit: 1/s
  description:
  - Electron-ion collision frequency.
  domain: '[0, inf)'
  solver_domain: '[0, inf)'
  abs_tol: 1.0
rho_star:
  default_unit: dimensionless
  description:
  - Normalized gyroradius.
  domain: '[0, inf)'
  solver_domain: '[0, inf)'
  abs_tol: 0.001
rho_L:
  aliases:
  - larmor_radius
  - gyroradius
  - ion_larmor_radius
  default_unit: m
  description:
  - Ion Larmor radius.
  domain: '[0, inf)'
  solver_domain: '[0, inf)'
  abs_tol: 1.0e-6
alpha_t:
  default_unit: dimensionless
  description:
  - Turbulence parameter.
  domain: '[0, inf)'
  solver_domain: '[0, inf)'
  abs_tol: 0.001
edge_collisionality:
  default_unit: dimensionless
  description:
  - Edge collisionality.
  domain: '[0, inf)'
  solver_domain: '[0, inf)'
  abs_tol: 0.001
tau_p:
  default_unit: s
  description:
  - Particle confinement time (generic).
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.005
tau_p_D:
  default_unit: s
  description:
  - Deuterium particle confinement time.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.005
tau_p_T:
  default_unit: s
  description:
  - Tritium particle confinement time.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.005
tau_p_He3:
  default_unit: s
  description:
  - Helium-3 particle confinement time.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.005
tau_p_He4:
  default_unit: s
  description:
  - Helium-4 particle confinement time.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.005
tau_p_Imp:
  default_unit: s
  description:
  - Generic impurity particle confinement time.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.005
tau_pulse:
  default_unit: s
  description:
  - Pulse length.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.005
H89:
  default_unit: dimensionless
  description:
  - H89 confinement enhancement factor.
  abs_tol: 0.001
H98_y2:
  default_unit: dimensionless
  description:
  - H98(y,2) confinement enhancement factor.
  abs_tol: 0.001
G89:
  default_unit: dimensionless
  description:
  - G89 gain factor.
  abs_tol: 0.001
P_fus:
