    Fast-alpha contribution to volume-averaged beta. The PROCESS Ward fit is
    the default; select the IPDG89/Hender relation explicitly when required.
  domain: '[0, 1]'
  abs_tol: 0.0001
  default_relation:
  - Fast-alpha beta Ward (PROCESS)
beta_beam:
  default_unit: dimensionless
  description: Neutral-beam fast-ion contribution to volume-averaged beta.
  domain: '[0, 1]'
  abs_tol: 0.0001
beta_with_fast_ions:
  default_unit: dimensionless
  description: Total volume-averaged beta including thermal, fast-alpha, and beam-ion pressure.
  domain: '[0, 1]'
  abs_tol: 0.0001
beta_N_with_fast_ions:
  default_unit: dimensionless
  description: Troyon-normalized beta including thermal and non-thermal ion pressure.
  domain: '[0, 0.2]'
  abs_tol: 0.0002
beta_T:
  default_unit: dimensionless
  aliases:
  - beta_toroidal  # CFSPOPCON variables.yaml
  - beta_toroidal_vol_avg  # PROCESS physics_variables.py
  description: Toroidal beta (fraction).
  domain: '[0, 1]'
  abs_tol: 0.0001
beta_p:
  default_unit: dimensionless
  aliases:
  - beta_poloidal  # CFSPOPCON variables.yaml
  - beta_poloidal_vol_avg  # PROCESS physics_variables.py
