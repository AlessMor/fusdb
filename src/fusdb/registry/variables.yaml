maximum_P_LH_factor_for_P_SOL:  # CHECK imported from cfspopcon (impurities/core_radiator_conc); CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: Maximum allowed ratio of power crossing the separatrix to the L-H threshold power.
  domain: (0, inf)
  abs_tol: 0.001
Q_sci:
  aliases:
  - Q
  - Q_phy
  default_unit: dimensionless
  description: scientific gain factor Q
  domain: '[0, inf)'
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.1
Q_eng:
  default_unit: dimensionless
  description: engineering gain factor Q_eng.
  domain: '[0, inf)'
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.1
Q_cfspopcon:
  default_unit: dimensionless
  description: fusion gain on cfspopcon's launched-power convention, P_fus / (P_aux_launched + P_ohmic).
  domain: '[0, inf)'
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.1
n_la:
  aliases:
  - n_e_la
  - n_e_line_avg  # fusdb legacy alias
  - line_average_n_e
  - nd_plasma_electron_line  # PROCESS physics_variables.py
  default_unit: 1/m^3
  description: Line-averaged electron density.
  domain: '[0, inf)'
  abs_tol: 1.0e+18
kappa_areal:
  default_unit: dimensionless
  aliases:
  - kappa_a
  - areal_elongation  # CFSPOPCON variables.yaml
  description: Areal elongation, S_phi / (pi a^2) -- the elongation of the equivalent
    ellipse with the same horizontal minor radius a and the same poloidal
    cross-sectional area. This is the ITER Physics Basis kappa_A, and the elongation
    cfspopcon calls ``areal_elongation``. Distinct from kappa_ipb (volume-equivalent)
    and from kappa (geometric b/a). See :cite:`zohm_2015`.
  domain: '(0, 10]'
  abs_tol: 0.001
  solver_domain: '[0.1, 10]'
  default_relation:
  - Areal elongation from cross-section
kappa_ipb:
  default_unit: dimensionless
  aliases:
  - kappa_IPB
  description: >-
    EFFECTIVE elongation required by the IPB98 implementation,
    V_p / (2 pi^2 R a^2) -- volume-equivalent, sometimes called Kardaun-corrected.
    Defined by what the IPB98(y,x) and ITPA20 fits were regressed against rather
    than by the geometry alone, which is why it is a separate variable from
    kappa_areal: the two coincide only for a plain ellipse and differ by ~2% at
    typical design points. See :cite:`zohm_2015`.
  domain: '(0, 10]'
  abs_tol: 0.001
  solver_domain: '[0.1, 10]'
afuel_total:  # PROCESS physics_variables.py
  aliases:
  - m_ions_total_amu  # PROCESS physics_variables.py
  default_unit: amu
  description: Mass-averaged mass of ALL plasma ions, impurities and helium ash
    included. Distinct from afuel, which is the FUEL ion mass -- PROCESS uses
    m_fuel_amu in the confinement scalings and m_ions_total_amu in the L-H
    thresholds, and they differ by ~9% at reactor conditions.
  domain: (0, inf)
  abs_tol: 0.001

afuel:
  aliases:
  - average_ion_mass  # CFSPOPCON variables.yaml
  - aion
  - M_i  # OpenPOPCON src/openpopcon.py
  - m_fuel_amu  # PROCESS physics_variables.py
  default_unit: amu
  description: Average fuel mass number (D/T/He3 only).
  domain: (0, inf)
  abs_tol: 0.001
rho:
  aliases:
  - normalized_minor_radius
  - r_over_a
  default_unit: dimensionless
  shape: 1
  description: Normalized minor-radius coordinate used for 1D profiles.
  domain: '[0, 1]'
  abs_tol: 0.001
temperature_peaking:
  default_unit: dimensionless
  aliases:
  - nu_T_e  # SPARC PRD Table 1 (electron temperature peaking)
  description: Peak-to-average electron-temperature profile peaking factor. Sets the electron temperature profile; the ion profile uses ion_temperature_peaking (which defaults to this value).
  # Peaking is NOT bounded below at 1: a HOLLOW profile (peak below the
  # volume average) is physical -- it occurs at the very centre of the core
  # in real discharges -- and is admissible as long as the density itself
  # stays positive.  The `[1, inf)` bound this replaces was introduced only
  # to carry the `max(..., 1.0)` clamps that used to sit inside the relation
  # bodies (clamps make a relation non-invertible), but it over-stated the
  # physics and failed reactors whose profile came out marginally hollow
  # (ARC_V3A at 1 - 4.2e-12, SPARC at 1 - 4.4e-5).
  domain: (0, inf)
  solver_domain: '[1e-6, inf)'
  rel_tol: 0.05
  abs_tol: 0.001
ion_temperature_peaking:  # ion temperature peaking; defaults to temperature_peaking unless set
  default_unit: dimensionless
  description: Peak-to-average ion-temperature profile peaking factor. Defaults to the (electron) temperature_peaking; supply it for an independent ion temperature profile.
  # Peaking is NOT bounded below at 1: a HOLLOW profile (peak below the
  # volume average) is physical -- it occurs at the very centre of the core
  # in real discharges -- and is admissible as long as the density itself
  # stays positive.  The `[1, inf)` bound this replaces was introduced only
  # to carry the `max(..., 1.0)` clamps that used to sit inside the relation
  # bodies (clamps make a relation non-invertible), but it over-stated the
  # physics and failed reactors whose profile came out marginally hollow
  # (ARC_V3A at 1 - 4.2e-12, SPARC at 1 - 4.4e-5).
  domain: (0, inf)
  solver_domain: '[1e-6, inf)'
  rel_tol: 0.05
  abs_tol: 0.001
density_peaking:  # electron density peaking; alias electron_density_peaking (cfspopcon name)
  aliases:
  - electron_density_peaking  # CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: Peak-to-average electron-density profile peaking factor. Sets the electron density profile; the ion profile uses ion_density_peaking (which defaults to this value).
  # Peaking is NOT bounded below at 1: a HOLLOW profile (peak below the
  # volume average) is physical -- it occurs at the very centre of the core
  # in real discharges -- and is admissible as long as the density itself
  # stays positive.  The `[1, inf)` bound this replaces was introduced only
  # to carry the `max(..., 1.0)` clamps that used to sit inside the relation
  # bodies (clamps make a relation non-invertible), but it over-stated the
  # physics and failed reactors whose profile came out marginally hollow
  # (ARC_V3A at 1 - 4.2e-12, SPARC at 1 - 4.4e-5).
  domain: (0, inf)
  solver_domain: '[1e-6, inf)'
  rel_tol: 0.05
  abs_tol: 0.001
  # One producer: the definitional peak/average ratio.  ``default_relation`` is
  # the set of relations enforced together, not a preference list, so listing the
  # empirical Angioni scaling here activated it ALONGSIDE the ratio -- as a
  # constraint with no output, whose only free variable (the unbounded
  # ``electron_density_peaking_offset``) then absorbed the disagreement between
  # them.  Angioni is opted into by name (see tests/cfspopcon_SPARC), which
  # bypasses this whitelist.
  default_relation:
  - Electron density peaking from peak and average
ion_density_peaking:  # ion density peaking; defaults to density_peaking unless set; CFSPOPCON variables.yaml
  default_unit: dimensionless
  aliases:
  - nu_n_i  # SPARC PRD Table 1
  description: Peak-to-average ion-density profile peaking factor. Defaults to the electron density_peaking; supply it (or include the Angioni ion variant) for an independent ion density profile.
  # Peaking is NOT bounded below at 1: a HOLLOW profile (peak below the
  # volume average) is physical -- it occurs at the very centre of the core
  # in real discharges -- and is admissible as long as the density itself
  # stays positive.  The `[1, inf)` bound this replaces was introduced only
  # to carry the `max(..., 1.0)` clamps that used to sit inside the relation
  # bodies (clamps make a relation non-invertible), but it over-stated the
  # physics and failed reactors whose profile came out marginally hollow
  # (ARC_V3A at 1 - 4.2e-12, SPARC at 1 - 4.4e-5).
  domain: (0, inf)
  solver_domain: '[1e-6, inf)'
  rel_tol: 0.05
  abs_tol: 0.001
  # Gates producers: profile-derived peaking wins when peak/average values are
  # available; the equality-to-electron default is the fallback. The Angioni ion
  # variant ("Ion density peaking (Angioni)") is off unless explicitly included.
  default_relation:
  - Ion density peaking from peak and average
  - Default ion density peaking from electron density peaking
effective_collisionality:  # CHECK imported from cfspopcon (plasma_profiles/density_peaking); CFSPOPCON variables.yaml
  default_unit: dimensionless
  aliases:
  - nu_eff  # SPARC PRD Table 1
  description: Effective collisionality used in the Angioni density-peaking scaling.
  domain: (0, inf)
  abs_tol: 0.001
electron_density_peaking_offset:  # CHECK imported from cfspopcon (plasma_profiles/density_peaking); CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: Scalar offset added to the Angioni electron density-peaking scaling.
  default: 0.0
  abs_tol: 0.001
ion_density_peaking_offset:  # CHECK imported from cfspopcon (plasma_profiles/density_peaking); CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: Scalar offset added to the Angioni ion density-peaking scaling.
  default: 0.0
  abs_tol: 0.001
dilution:  # CHECK imported from cfspopcon (plasma_profiles/density_peaking); CFSPOPCON variables.yaml
  aliases:
  - fuel_dilution
  - plasma_dilution  # OpenPOPCON src/openpopcon.py
  default_unit: dimensionless
  # TERMINOLOGY: f_X are FRACTIONS (n_X/n_i), c_X are CONCENTRATIONS (n_X/n_e),
  # and this is the FUEL DILUTION -- the fuel share of the electron density.
  #
  # It is NOT `c_H` and NOT `n_i/n_e`.  c_H is the HYDROGENIC concentration
  # (p + D + T)/n_e; the fuel dilution drops protium (ash) and adds He3 (fuel,
  # at Z = 2).  They coincide only when there is no protium and no He3, which
  # is every D-T case in the suite -- so the distinction is invisible in the
  # tests and must be kept straight by definition rather than by measurement.
  # PROCESS does not use the concept at all.
  description: >-
    FUEL DILUTION: the fuel share of the electron density,
    (n_D + n_T + 2 n_He3) / n_e, charge-weighted so He3 enters at Z = 2.
    Counts He3 as FUEL and protium as ASH, so it is neither the hydrogenic
    concentration c_H (p + D + T) nor n_i/n_e.
  domain: (0, 1]
  abs_tol: 0.001
  # cfspopcon's form counts only D and T and derives them from the impurity
  # concentrations (1 - sum_X c_X Zbar_X).  That is faithful THERE -- cfspopcon
  # has no He3 fuel and treats all helium as an impurity -- but it is a
  # SIMPLIFICATION here, so it is not the default; tests/cfspopcon_SPARC selects
  # it by name so that comparison uses cfspopcon's own definition.
  default_relation:
  - Fuel dilution from fuel fractions
