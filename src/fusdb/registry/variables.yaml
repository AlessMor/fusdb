  domain: '[0, inf)'
  abs_tol: 1000000.0
P_LH:
  default_unit: W
  aliases:
  - P_LH_thresh  # CFSPOPCON variables.yaml
  - p_l_h_threshold_mw  # PROCESS physics_variables.py
  description: L-H transition threshold power.
  domain: '[0, inf)'
  abs_tol: 1000000.0
  # Gate: PROCESS's own default (`i_l_h_threshold = 19`) -- Martin 2008 with the
  # Takizuka aspect-ratio correction, on the LINE-averaged density Martin fitted,
  # and with the isotope factor evaluated on the TOTAL ion mass (`afuel_total`)
  # exactly as PROCESS does: every one of its 21 L-H scalings takes
  # m_ions_total_amu, not m_fuel_amu.  The fuel-mass sibling
  # ("L-H threshold Martin-2008 aspect nominal") runs ~9% high wherever there is
  # a real ash/impurity inventory and is kept only as the gated variant.
  # Also off unless explicitly included: the cfspopcon-faithful Martin+Ryter form
  # ("L-H transition threshold power (Martin-Ryter)", which adds the low-density
  # rollover but drops the aspect correction and uses the VOLUME average, as
  # cfspopcon does), and the 17 other PROCESS scalings.
  default_relation:
  - L-H threshold Martin-2008 aspect nominal (total ion mass)
