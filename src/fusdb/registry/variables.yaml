  - Minimum radiated power from fraction
minimum_core_radiated_fraction:  # CHECK imported from cfspopcon (impurities/core_radiator_conc); CFSPOPCON variables.yaml
  default_unit: dimensionless
  description: Minimum core radiated power expressed as a fraction of the input power.
  domain: '[0, 1]'
