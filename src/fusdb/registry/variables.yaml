# TODO: include aliases from cfspopcon and PROCESS

defaults:
  rel_tol: 0.01
  abs_tol: 0.0
  profile_size: 46
R:
  aliases:
  - major_radius
  - rmajor
  default_unit: m
  description:
  - Major radius.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
a:
  aliases:
  - minor_radius
  - r_minor
  - rminor
  default_unit: m
  description:
  - Minor radius.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
A:
  default_unit: dimensionless
  aliases:
  - aspect_ratio
  - aspect
  description:
  - Aspect ratio (R/a).
  domain: (0, inf)
  solver_domain: '[1e-12, 30]'
  abs_tol: 0.001
eps:
  default_unit: dimensionless
  aliases:
  - epsilon
  - inverse_aspect_ratio
  description:
  - Inverse aspect ratio (a/R).
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
kappa:
  default_unit: dimensionless
  aliases:
  - elongation
  - areal_elongation
  description:
  - Elongation.
  domain: (0, inf)
  solver_domain: '[0.1, 10]'
  abs_tol: 0.001
  default: 1.0
  # CHECK gate: pre-existing producers stay the defaults; the PROCESS shape
  # scalings (STAR, Zohm, MAST, FIESTA, inductance, Menard-1997) are opt-in.
  default_relation:
  - Elongation
  - ST elongation vs aspect ratio
separatrix_elongation:  # CHECK imported from cfspopcon (radiated_power/synchrotron); supplied or set from geometry
  default_unit: dimensionless
  description:
  - Plasma elongation at the separatrix.
  domain: (0, inf)
  solver_domain: '[0.1, 10]'
  abs_tol: 0.001
kappa_95:
  aliases:
  - kappa95
  - elongation_psi95
  default_unit: dimensionless
  description:
  - Elongation at 95% flux surface.
  domain: (0, inf)
  solver_domain: '[0.1, 10]'
  abs_tol: 0.001
  # CHECK gate: IPDG89 kappa/1.12 stays the default; the PROCESS CREATE
  # EU-DEMO fit is opt-in.
  default_relation:
  - Elongation 95%
delta:
  default_unit: dimensionless
  aliases:
  - triangularity
  - triang
  description:
  - Core triangularity.
  domain: '[-1, 1]'
  abs_tol: 0.001
  default: 0.0
  # CHECK gate: pre-existing producers stay the defaults; the PROCESS shape
  # scalings (STAR, MAST, FIESTA) are opt-in.
  default_relation:
  - Triangularity 95%
  - ST triangularity vs aspect ratio
delta_95:
  default_unit: dimensionless
  aliases:
  - triangularity_psi95
  - triang95  # CHECK PROCESS name (plasma_geometry)
  description:
  - Triangularity at 95% flux surface.
  domain: '[0, 1]'
  abs_tol: 0.001
V_p:
  default_unit: m^3
  aliases:
  - plasma_volume
  - vol_plasma  # CHECK PROCESS name (plasma_geometry)
  description:
  - Plasma volume.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0
  # CHECK gate: Sauter volume stays the default; the PROCESS arcs volume is opt-in.
  default_relation:
  - Tokamak plasma volume
A_p:
  default_unit: m^2
  aliases:
  - plasma_surface_area
  - surface_area
  - S_p
  - a_plasma_surface  # CHECK PROCESS name (density_limit)
  description:
  - Surface area around the LCFS in the toroidal and poloidal direction.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.1
  # CHECK gate: Sauter surface stays the default; the PROCESS arcs surface is opt-in.
  default_relation:
  - Tokamak plasma surface
S_fw:
  default_unit: m^2
  aliases:
  - A_fw
  description:
  - First wall surface area.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.1
  default: A_p
S_phi:
  default_unit: m^2
  aliases:
  - plasma_cross_section
  - S_cross
  - a_plasma_poloidal  # CHECK PROCESS name (plasma_geometry)
  description:
  - Surface of the plasma cross-section in the radial and poloidal direction.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.1
  # CHECK gate: Sauter cross-section stays the default; the PROCESS arcs
  # cross-section and simplified-squareness Sauter variant are opt-in.
  default_relation:
  - Tokamak plasma cross-sectional surface
L_p:
  default_unit: m
  aliases:
  - poloidal_circumference
  - len_plasma_poloidal  # CHECK PROCESS name (plasma_fields)
  description:
  - Poloidal length around the plasma cross-section.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
  # CHECK gate: Sauter poloidal length stays the default; the PROCESS arcs
  # perimeter and simplified-squareness Sauter variant are opt-in.
  default_relation:
  - Tokamak plasma poloidal length
squareness:
  default_unit: dimensionless
  aliases:
  - xi
  - plasma_square  # CHECK PROCESS name (plasma_geometry)
  description:
  - Squareness (xi).
  domain: '[-0.5, 0.5]'
  abs_tol: 0.001
  default: 0.0
R_min:
  default_unit: m
  description:
  - Inboard major radius extent from the center of the torus.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
R_max:
  default_unit: m
  description:
  - Outboard major radius extent from the center of the torus.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
Z_min:
  default_unit: m
  description:
  - Lower vertical extent.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
Z_max:
  default_unit: m
  description:
  - Upper vertical extent.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
B:
  default_unit: T
  description:
  - Magnetic field (profile over radial direction).
  shape: 1
  domain: '[0, inf)'
  abs_tol: 0.01
  solver_domain: '[1e-12, 30]'
B0:
  default_unit: T
  aliases:
  - magnetic_field_on_axis
  - b_plasma_toroidal_on_axis
  description:
  - Toroidal field on axis.
  domain: (0, inf)
  solver_domain: '[1e-12, 30]'
  abs_tol: 0.01
B_max:
  default_unit: T
  description:
  - Peak field on coil.
  abs_tol: 0.01
  solver_domain: '[1e-12, 30]'
B_p:
  default_unit: T
  aliases:
  - b_plasma_surface_poloidal_average  # CHECK PROCESS name (plasma_fields)
  description:
  - Poloidal field.
  domain: '[0, inf)'
  solver_domain: '[1e-12, 30]'
  abs_tol: 0.01
  # CHECK gate: the Ampere surface-average stays the default; the Peng/STAR TART
  # branch (spherical tokamaks) is opt-in.
  default_relation:
  - Surface-averaged poloidal field from plasma current
I_p:
  default_unit: A
  aliases:
  - plasma_current  # CHECK PROCESS name (plasma_fields); PROCESS uses amperes
  description:
  - Plasma current.
  domain: '[0, inf)'
  solver_domain: '[1e-12, inf)'
  abs_tol: 10000.0
f_BS:
  default_unit: dimensionless
  aliases:
  - bootstrap_fraction
  description:
  - Bootstrap current fraction.
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
  # CHECK gate: the cfspopcon Gi (2014) bootstrap stays the default; the PROCESS
  # scalings (ITER-89, Sakai, ARIES, Andrade, Hoang, Wong, Gi-II, Sugiyama L/H,
  # Nevins, Wilson, Sauter) are off unless explicitly included.
  default_relation:
  - Bootstrap current fraction
f_NI:
  default_unit: dimensionless
  description:
  - Non-inductive current fraction.
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
f_CD:
  default_unit: dimensionless
  description:
  - Driven current fraction (excluding bootstrap).
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
q95:
  default_unit: dimensionless
  description:
  - Safety factor at 95% flux surface.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
q_cyl:
  aliases:
  - cylindrical_safety_factor
  - q_cylindrical
  - q_I
  default_unit: dimensionless
  description:
  - Cylindrical edge safety factor.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
qstar:
  aliases:
  - q_star
  default_unit: dimensionless
  description:
  - Equivalent cylindrical edge safety factor.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
f_shaping:  # CHECK imported from cfspopcon (plasma_current/safety_factor)
  default_unit: dimensionless
  description:
  - Plasma shaping function used in the q_star/plasma-current relation (ITER Physics Basis Ch.1 Eq. A-11).
  domain: (0, inf)
  solver_domain: '[1e-12, 100]'
  abs_tol: 0.001
  # CHECK gate: the cfspopcon IPB shaping function stays the default; the PROCESS
  # fq scalings (Peng, Todd I/II, Connor-Hastie, Sauter, FIESTA) are opt-in.
  default_relation:
  - Plasma shaping function for q_star
q_a:
  default_unit: dimensionless
  description:
  - Edge safety factor.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
q_min:
  default_unit: dimensionless
  description:
  - Minimum safety factor.
  domain: (0, inf)
  solver_domain: '[1e-12, 50]'
  abs_tol: 0.001
li:
  default_unit: dimensionless
  description:
  - Internal inductance.
  abs_tol: 0.001
beta_N:
  default_unit: dimensionless
  aliases:
  - beta_normalized
  description:
  - Normalized beta.
  domain: '[0, inf)'
  abs_tol: 0.02
  solver_domain: '[0, 20]'
beta:
  default_unit: dimensionless
  aliases:
  - beta_total
  description:
  - Total beta.
  domain: '[0, inf)'
  abs_tol: 0.0001
  solver_domain: '[0, 1]'
beta_T:
  default_unit: dimensionless
  aliases:
  - beta_toroidal
  description:
  - Toroidal beta (fraction).
  domain: '[0, inf)'
  solver_domain: '[0, 1]'
  abs_tol: 0.0001
beta_p:
  default_unit: dimensionless
  aliases:
  - beta_poloidal
  description:
  - Poloidal beta.
  domain: '[0, inf)'
  solver_domain: '[0, 10]'
  abs_tol: 0.01
beta_limit:
  default_unit: dimensionless
  description:
  - Troyon beta limit.
  domain: '[0, inf)'
  abs_tol: 0.0001
  solver_domain: '[0, 1]'
troyon_margin:
  default_unit: dimensionless
  description:
  - Margin to the Troyon beta limit.
  abs_tol: 0.0001
p_th:
  default_unit: Pa
  description:
  - Thermal pressure.
  aliases:
  - p_tot_avg
  - average_total_pressure
  abs_tol: 1000.0
p_peak:
  default_unit: Pa
  aliases:
  - peak_pressure
  description:
  - Peak pressure.
  abs_tol: 1000.0
W_th:
  default_unit: J
  description:
  - Thermal stored energy.
  domain: '[0, inf)'
  abs_tol: 1000000.0
T_e_avg:
  aliases:
  - T_avg
  - average_electron_temp
  - ten
  default_unit: keV
  description:
  - Volume-averaged electron temperature.
  domain: (0, inf)
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_sep:
  aliases:
  - separatrix_electron_temp
  default_unit: keV
  description:
  - Separatrix electron temperature.
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_edge:
  aliases:
  - edge_electron_temp
  - edge_electron_temperature
  default_unit: keV
  description:
  - Edge collision temperature used by AMJUEL H.2 atomic-physics rate fits.
  domain: (0, inf)
  solver_domain: '[1e-12, 300]'
  abs_tol: 1.0e-4
n_e_edge:
  aliases:
  - edge_electron_density
  default_unit: 1/m^3
  description:
  - Edge electron density used by AMJUEL H.4 atomic-physics rate fits.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
T_e:
  aliases:
  - T_e_prof
  default_unit: keV
  description:
  - Electron temperature.
  shape: 1
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
  default_relation:
  - Default electron temperature profile from average temperature
T0:
  aliases:
  - T_e_peak
  - temp_plasma_electron_on_axis_kev  # CHECK PROCESS name (radiation_power); PROCESS uses keV
  default_unit: keV
  description:
  - On-axis/peak electron temperature.
  domain: (0, inf)
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_i:
  aliases:
  - T_i_prof
  default_unit: keV
  description:
  - Ion temperature.
  shape: 1
  average_variable: T_i_avg
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
  default_relation:
  - Default ion temperature profile from average temperature
T_i_avg:
  default_unit: keV
  aliases:
  - average_ion_temp
  description:
  - Volume-averaged ion temperature.
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
T_i_peak:
  default_unit: keV
  description:
  - On-axis/peak ion temperature.
  domain: '[0, inf)'
  solver_domain: '[1e-12, 300]'
  abs_tol: 0.05
ion_to_electron_temp_ratio:
  default_unit: dimensionless
  description:
  - Ratio of volume-averaged ion temperature to electron temperature.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
n_e_avg:
  aliases:
  - n_avg
  - average_electron_density
  default_unit: 1/m^3
  description:
  - Volume-averaged electron density.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
n_sep:
  aliases:
  - separatrix_electron_density
  default_unit: 1/m^3
  description:
  - Separatrix electron density.
  domain: '[0, inf)'
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
nesep_over_nebar:  # CHECK imported from cfspopcon (scrape_off_layer/separatrix_density)
  default_unit: dimensionless
  aliases:
  - prn1  # CHECK PROCESS name (density_limit); PROCESS defines prn1 = nesep/dene
  description:
  - Ratio of separatrix electron density to volume-averaged electron density.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
n_i_avg:
  aliases:
  - average_ion_density
  default_unit: 1/m^3
  description:
  - Volume-averaged ion (fuel) density, distinct from the electron average when
    impurity dilution is present.
  default_relation:
  - Default ion density average from plasma average density
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
n0:
  aliases:
  - n_e_peak
  - nd_plasma_electron_on_axis  # CHECK PROCESS name (radiation_power)
  default_unit: 1/m^3
  description:
  - On-axis electron density.
  domain: (0, inf)
  solver_domain: '[1e-12, inf)'
  abs_tol: 1.0e+18
n_e:
  aliases:
  - n_e_prof
  default_unit: 1/m^3
  description:
  - Electron density.
  shape: 1
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
  default_relation:
  - Default electron density profile from average density
n_i:
  aliases:
  - n_i_prof
  default_unit: 1/m^3
  description:
  - Ion density.
  shape: 1
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
  default_relation:
  - Ion density from electron density and fuel fractions
  - Ion density from tracked species densities
n_i_peak:
  default_unit: 1/m^3
  description:
  - On-axis/peak ion density.
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
n_i_tau_E_T_i:
  default_unit: keV*s/m^3
  aliases:
  - fusion_triple_product
  description:
  - Fusion triple product from peak ion density, temperature, and confinement.
  domain: '[0, inf)'
  abs_tol: 1.0e+19
n_GW:
  default_unit: 1/m^3
  aliases:
  - greenwald_density_limit
  description:
  - Greenwald density limit.
  domain: '[0, inf)'
  solver_domain: '[0, inf)'
  abs_tol: 1.0e+18
n_SUDO:
  default_unit: 1/m^3
  description:
  - Sudo density limit.
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
f_GW:
  default_unit: dimensionless
  aliases:
  - greenwald_fraction
  description:
  - Greenwald fraction.
  domain: '[0, inf)'
  abs_tol: 0.001
  solver_domain: '[0, inf)'
greenwald_margin:
  default_unit: 1/m^3
  description:
  - Margin to the Greenwald density limit.
  abs_tol: 1.0e+18
sudo_margin:
  default_unit: 1/m^3
  description:
  - Margin to the Sudo density limit.
  abs_tol: 1.0e+18
Z_eff:
  aliases:
  - zeff
  - z_effective
  default_unit: dimensionless
  description:
  - Effective charge.
  domain: '[0, inf)'
  abs_tol: 0.001
Z_bar:
  aliases:
  - mean_ion_charge_state
  default_unit: dimensionless
  description:
  - Mean ion charge state.
  domain: '[0, inf)'
  solver_domain: '[1e-12, inf)'
  abs_tol: 0.001
n_D:
  default_unit: 1/m^3
  description:
  - Deuterium ion density profile.
  shape: 1
  average_variable: n_D_avg
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
n_D_avg:
  default_unit: 1/m^3
  description:
  - Volume-averaged deuterium ion density.
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
n_T:
  default_unit: 1/m^3
  description:
  - Tritium ion density profile.
  shape: 1
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
n_He3:
  default_unit: 1/m^3
  description:
  - Helium-3 ion density profile.
  shape: 1
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
n_He4:
  default_unit: 1/m^3
  description:
  - Helium-4 ion density profile.
  shape: 1
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
n_imp:
  default_unit: 1/m^3
  description:
  - Generic impurity ion density profile.
  shape: 1
  domain: '[0, inf)'
  abs_tol: 1.0e+18
  solver_domain: '[0, inf)'
f_D:
  default_unit: dimensionless
  description:
  - Core deuterium ion fraction, enforced by n_D = f_D * n_i.
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
  default: 0.5
  default_requires: tau_p
f_T:
  default_unit: dimensionless
  description:
  - Core tritium ion fraction, enforced by n_T = f_T * n_i.
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
  default: 0.5
  default_requires: tau_p
f_He3:
  default_unit: dimensionless
  description:
  - Core helium-3 ion fraction, enforced by n_He3 = f_He3 * n_i.
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
  default: 0.0
  default_requires: tau_p
f_He4:
  default_unit: dimensionless
  description:
  - Core helium-4 ion fraction, enforced by n_He4 = f_He4 * n_i.
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
  default: 0.0
  default_requires: tau_p
f_Imp:
  default_unit: dimensionless
  description:
  - Core generic impurity ion fraction, enforced by n_imp = f_Imp * n_i.
  domain: '[0, 1]'
  abs_tol: 0.001
  solver_domain: '[0, 1]'
  default: 0.0
  default_requires: tau_p
# Per-species impurity concentrations (n_imp/n_e) for line radiation.
# CHECK imported from cfspopcon (Mavrin/Post-Jensen impurity radiated power).
c_He:
  default_unit: dimensionless
  description: ['Helium concentration n_He/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Li:
  default_unit: dimensionless
  description: ['Lithium concentration n_Li/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Be:
  default_unit: dimensionless
  description: ['Beryllium concentration n_Be/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_C:
  default_unit: dimensionless
  description: ['Carbon concentration n_C/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_N:
  default_unit: dimensionless
  description: ['Nitrogen concentration n_N/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_O:
  default_unit: dimensionless
  description: ['Oxygen concentration n_O/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Ne:
  default_unit: dimensionless
  description: ['Neon concentration n_Ne/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Ar:
  default_unit: dimensionless
  description: ['Argon concentration n_Ar/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Kr:
  default_unit: dimensionless
  description: ['Krypton concentration n_Kr/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Xe:
  default_unit: dimensionless
  description: ['Xenon concentration n_Xe/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_W:
  default_unit: dimensionless
  description: ['Tungsten concentration n_W/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
TBR:
  default_unit: dimensionless
  description:
  - Tritium breeding ratio.
  domain: '[0, inf)'
  abs_tol: 0.001
tau_E:
  default_unit: s
  aliases:
  - energy_confinement_time
  description:
  - Energy confinement time.
