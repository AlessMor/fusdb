beta_limit:
  default_unit: dimensionless
  description: Troyon beta limit.
  domain: '[0, 1]'
  abs_tol: 0.0001
troyon_margin:
  default_unit: dimensionless
  description: Margin to the Troyon beta limit.
  abs_tol: 0.0001
p_th:
  default_unit: Pa
  description: Volume-averaged thermal pressure.
  aliases:
  - p_th_avg
  - p_th_vol_avg
  - p_tot_avg
  - p_tot_vol_avg
  - average_total_pressure  # CFSPOPCON variables.yaml
  - pres_plasma_thermal_vol_avg  # PROCESS physics_variables.py
  abs_tol: 1000.0
  # CHECK gate: fusdb's profile-integrated "Thermal pressure" is the default;
  # cfspopcon's undiluted product-of-averages form is opt-in (keeps it from
  # tag-matching as a second, conflicting p_th producer in other reactors).
  default_relation:
  - Thermal pressure
p_fast_alpha:
  default_unit: Pa
  description: Volume-averaged pressure carried by non-thermal fusion alpha particles.
  domain: '[0, inf)'
  abs_tol: 1000.0
p_fast_beam:
  default_unit: Pa
  description: Volume-averaged pressure carried by non-thermal neutral-beam ions.
  domain: '[0, inf)'
  abs_tol: 1000.0
p_with_fast_ions:
  default_unit: Pa
  description: Total plasma pressure including thermal, fast-alpha, and beam-ion components.
  domain: '[0, inf)'
  abs_tol: 1000.0
p_th_rho_avg:
  default_unit: Pa
  description: Straight-rho averaged thermal pressure.
  aliases:
  - p_tot_rho_avg
  - rho_average_total_pressure
  abs_tol: 1000.0
p_peak:
  default_unit: Pa
  aliases:
  - peak_pressure  # CFSPOPCON variables.yaml
  - pres_plasma_thermal_on_axis  # PROCESS physics_variables.py
  description: Peak pressure.
  abs_tol: 1000.0
W_th:
  default_unit: J
  description: Thermal stored energy.
  domain: '[0, inf)'
