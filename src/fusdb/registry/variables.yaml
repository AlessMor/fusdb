  domain: '[0, 1]'
  default: 0.0
  default_requires: tau_p
  abs_tol: 0.001
c_Xe:
  default_unit: dimensionless
  description: Xenon concentration n_Xe/n_e for line radiation.
  domain: '[0, 1]'
  default: 0.0
  # Gated on tau_p like every other impurity.  Xenon USED to be gated on Z_eff,
  # which made it the designated free knob: a declared Z_eff was treated as
  # evidence that xenon is present, and the solver inverted the Z_eff equation
  # for it.  That is what let a reactor declaring only a Z_eff silently acquire
  # a xenon inventory it never specified -- and it is the cycle every failed
  # composition attempt ran through (c_Xe -> composition -> Z_eff -> c_Xe).
  #
  # A reactor is now 100% fuel plus its own declared impurities: an impurity
  # concentration is SUPPLIED or EXACTLY ZERO.  A machine that declares a Z_eff
  # but neither a composition nor a tau_p will therefore report that Z_eff as
  # inconsistent instead of manufacturing xenon to reach it.  That inconsistency
  # is the honest answer -- the reactor really has not said what is radiating.
  default_requires: tau_p
  abs_tol: 0.001
c_W:
  default_unit: dimensionless
  description: Tungsten concentration n_W/n_e for line radiation.
  domain: '[0, 1]'
  default: 0.0
  default_requires: tau_p
  abs_tol: 0.001
# -- mean ionisation states ------------------------------------------------
# Zbar_X is the mean charge state of element X: sum_q q*n_{X,q} / sum_q n_{X,q}.
# It is the ONE place the coronal-equilibrium assumption lives.  Every charge
# moment of the composition reads it -- quasineutrality (sum_X c_X Zbar_X) and
# Z_eff (sum_X c_X Zbar_X^2) -- so a reactor that knows its own charge states
# can supply Zbar_X and override the fit, which was impossible while the fit
# was called inline inside each relation.
#
# NOT an effective charge: Z_eff is QUADRATIC in the charge, Zbar is LINEAR.
#
# No registry `default`: the Mavrin producer determines these.  A default here
# was TRIED and reverted -- gated on c_X it fired on every element (an impurity
# that is seeded rather than supplied is in neither `supplied` nor
# `base_forward`, relationsystem.py:858), which silently replaced the coronal
# charge with the bare atomic number: Zbar_Xe 48.7 -> 54, and the solver then
# inverted for 23% less xenon while Z_eff still matched its declared value.
#
# Hydrogen has no Mavrin entry (the fits start at He) and is fully stripped at
# any temperature fusdb models, so it enters every moment at Zbar = 1 exactly
# and needs no variable.
Zbar_He:
  default_unit: dimensionless
  description: Mean ionisation state of He (sum_q q n_q / sum_q n_q).
  domain: '[0, 2]'
  abs_tol: 0.01
  default_relation:
  - Mean ionisation state of He (radas coronal)
Zbar_Li:
  default_unit: dimensionless
  description: Mean ionisation state of Li (sum_q q n_q / sum_q n_q).
  domain: '[0, 3]'
  abs_tol: 0.01
  default_relation:
  - Mean ionisation state of Li (radas coronal)
Zbar_Be:
  default_unit: dimensionless
  description: Mean ionisation state of Be (sum_q q n_q / sum_q n_q).
  domain: '[0, 4]'
  abs_tol: 0.01
  default_relation:
