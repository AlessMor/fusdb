  default_unit: dimensionless
  description: ['Helium concentration n_He/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Li:
  default_unit: dimensionless
  description: ['Lithium concentration n_Li/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Be:
  default_unit: dimensionless
  description: ['Beryllium concentration n_Be/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_C:
  default_unit: dimensionless
  description: ['Carbon concentration n_C/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_N:
  default_unit: dimensionless
  description: ['Nitrogen concentration n_N/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_O:
  default_unit: dimensionless
  description: ['Oxygen concentration n_O/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Ne:
  default_unit: dimensionless
  description: ['Neon concentration n_Ne/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Ar:
  default_unit: dimensionless
  description: ['Argon concentration n_Ar/n_e for line radiation.']
  domain: '[0, 1]'
  default: 0.0
  abs_tol: 0.001
c_Kr:
  default_unit: dimensionless
  description: ['Krypton concentration n_Kr/n_e for line radiation.']
  domain: '[0, 1]'
