is_metallic_wall:
  default_unit: dimensionless
  description: >-
    Plasma-facing-wall material flag for the FUSE/IMAS L-H scaling: 1 for a
    metallic wall and 0 for graphite/carbon. FUSE/IMAS defaults to metallic
    when wall material is unavailable.
  domain: '[0, 1]'
  default: 1
  abs_tol: 0.001
P_HL:
  default_unit: W
  # The H->L BACK-transition power.  The forward (L->H) and back (H->L)
  # transitions do not happen at the same power: once an edge barrier exists it
  # is sustained below the power needed to create it, so P_HL < P_LH and the
  # band between them is genuinely bistable -- which branch the plasma occupies
  # is set by how it got there.  fusdb has no time axis, so the DECLARED
  # confinement_mode tag is the steady-state stand-in for that history: inside
  # the band both h_mode and l_mode certifiers hold, both modes are admissible,
  # and the declared one wins.  The hysteresis therefore needs no special case
  # in the regime driver -- it falls out of overlapping certifiers plus the
  # admissible-count rule.
  description: >-
    H-L back-transition threshold power.  Below this an existing H-mode is lost;
    between P_HL and P_LH both L- and H-mode are self-consistent (hysteresis).
  domain: '[0, inf)'
  abs_tol: 1000000.0
  default_relation:
  - H-L back-transition threshold power
f_HL_hysteresis:
  default_unit: dimensionless
  # DIII-D back-transition measurements give P_HL/P_LH = 35-70%, and ITER
  # studies suggest the ratio may need to be as low as ~50%.  0.7 is the
  # CONSERVATIVE end of that range: it makes the bistable band as narrow as the
  # measurements support, so hysteresis is never claimed more widely than the
  # data warrants.  Supply a smaller value for a wider band.
  description: >-
    Ratio of the H-L back-transition power to the L-H threshold power,
    P_HL / P_LH.  Measured range 0.35-0.70.
  default: 0.7
  abs_tol: 0.001
P_LI_thresh:  # CHECK imported from cfspopcon (separatrix_conditions/threshold_power); CFSPOPCON variables.yaml
  default_unit: W
  description: L-I transition threshold power.
  domain: '[0, inf)'
  abs_tol: 1000000.0
  # Gate: Hubbard-2017 on the LINE-AVERAGED density, which is what the source
  # fits.  RESOLVED 2026-08-07 from Hubbard et al., Nucl. Fusion 57 126039
  # (2017): the regression is P(L-I)/(n_e S) ~ B_T^0.26 with n_e the
  # LINE-AVERAGED electron density ("power is normalized to n_e and to surface
  # area S for comparison with other tokamaks"), consistent with the AUG result
  # P_L-I/n_e ~ B_T^0.39 quoted alongside it.  PROCESS uses n_la and is right;
  # the cfspopcon-derived relations substitute the VOLUME average, so they are
  # kept but gated.  The Hubbard-2012 and AUG variants are off unless included.
  default_relation:
  - L-I threshold Hubbard-2017
ratio_of_P_SOL_to_P_LH:  # CHECK imported from cfspopcon (separatrix_conditions/threshold_power)
  default_unit: dimensionless
  description: Ratio of power crossing the separatrix to the L-H threshold power.
