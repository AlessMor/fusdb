[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fusdb"
version = "0.1.0"
description = "Fusion reactor scenario database with per-folder YAML and a single Reactor class."
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.1", "PyYAML>=6.0", "scipy>=1.11", "networkx>=3.0", "pint>=0.23"]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7", "bokeh>=3.5"]
# Result saving/loading (fusdb.save_result / fusdb.load_result) uses HDF5.
io = ["h5py>=3.0"]
# Optional dataset features: symbolic reactivity placeholders (sympy) and the
# PRF profile lookup tables (pandas).  Imported lazily; only needed when those
# features are actually evaluated.
datasets = ["sympy>=1.12", "pandas>=2.2"]
# h5py reads the cfspopcon reference dataset.nc (netCDF4/HDF5) in
# tests/cfspopcon_SPARC; matplotlib backs the comparison notebook/plots.
test = ["pytest>=7.0", "h5py>=3.0", "matplotlib>=3.7", "sympy>=1.12", "pandas>=2.2"]
docs = [
    "matplotlib>=3.7",
    "bokeh>=3.5",
    "mkdocs-awesome-pages-plugin>=2.10",
    "mkdocs-bibtex>=4.4",
    "mkdocs-gen-files>=0.5",
    "mkdocs-jupyter==0.25.1",
    "mkdocs==1.6.1",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.11",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fusdb = [
    "registry/*.yaml",
    "registry/dataset/fusion/*.yaml",
    "registry/dataset/atomic_reactions/*/*.yaml",
    "registry/dataset/atomic_reactions/mar/*/*.yaml",
    "registry/dataset/radiation/*.yaml",
]
